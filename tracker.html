<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="BDO Guide EVO — трекер постройки галеона">
  <title>Трекер кораблей — BDO Guide EVO</title>
  <style>
    :root{--bg:#090b0f;--panel:#11151d;--line:#303846;--text:#edf0f6;--muted:#a7afbd;--gold:#e4bf75}
    *{box-sizing:border-box}html,body{height:100%;margin:0}body{overflow:hidden;background:var(--bg);color:var(--text);font:16px/1.45 Inter,Segoe UI,Arial,sans-serif}
    .topbar{height:70px;padding:0 24px;display:flex;align-items:center;border-bottom:1px solid var(--line);background:#090b0f;position:relative;z-index:2}
    .app-switcher{display:flex;align-items:center;gap:8px}
    .brand{display:flex;align-items:center;gap:12px;padding:6px 10px;border:1px solid transparent;border-radius:13px;color:var(--text);text-decoration:none;transition:.18s ease}
    .brand:hover{border-color:#4d5869;background:#171c25}.brand.active{border-color:#465d78;background:linear-gradient(145deg,#121b25,#11151d);box-shadow:inset 0 0 0 1px rgba(157,201,255,.08)}
    .brand-mark{width:38px;height:38px;display:grid;place-items:center;border:1px solid #715a33;border-radius:12px;background:linear-gradient(145deg,#2b251a,#111);color:var(--gold);font-weight:900}
    .ship-mark{color:#9dc9ff;border-color:#465d78;background:#121b25}.brand b{display:block;letter-spacing:.08em}.brand small{display:block;color:var(--muted);font-size:11px;text-transform:uppercase}
    iframe{display:block;width:100%;height:calc(100vh - 70px);border:0;background:var(--bg)}
    @media(max-width:700px){.topbar{height:62px;padding:0 14px}.brand{padding:5px}.brand>div:last-child{display:none}iframe{height:calc(100vh - 62px)}}
  </style>
</head>
<body>
  <header class="topbar">
    <nav class="app-switcher" aria-label="Разделы сайта">
      <a class="brand" href="./index.html"><div class="brand-mark">B</div><div><b>BDO GUIDE EVO</b><small>маршрут новичка • RU</small></div></a>
      <a class="brand active" href="./tracker.html" aria-current="page"><div class="brand-mark ship-mark">⚓</div><div><b>SHIP TRACKER</b><small>галеон «Прогресс»</small></div></a>
    </nav>
  </header>
  <iframe src="./tracker/index.html" title="Трекер постройки кораблей BDO" loading="eager"></iframe>
</body>
</html>
