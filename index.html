  <script>
  const official={
    beginner:'https://www.ru.playblackdesert.com/Wiki/Default?wikiNo=242',
    gear:'https://www.ru.playblackdesert.com/Wiki/Default?wikiNo=244',
    graduation:'https://www.ru.playblackdesert.com/Wiki/Default?wikiNo=217',
    magnus:'https://www.ru.playblackdesert.com/Wiki/Default?wikiNo=254',
    support:'https://www.ru.playblackdesert.com/News/Notice/Detail?CountryType=ru-RU&boardNo=11395',
    sov:'https://www.ru.playblackdesert.com/Wiki/Default?wikiNo=318',
    enhance:'https://www.ru.playblackdesert.com/Wiki/Default?wikiNo=75',
    seasonNew:'https://www.ru.playblackdesert.com/News/Notice/Detail?boardNo=11773&boardType=0&countryType=ru-RU&currentPage=1',
    roadmap:'https://www.ru.playblackdesert.com/News/Notice/Detail?boardNo=12537&boardType=3&countryType=ru-RU&currentPage=1',
    academy:'https://www.ru.playblackdesert.com/News/Notice/Detail?boardNo=11931&countryType=ru-RU',
    kharazad:'https://www.ru.playblackdesert.com/News/Notice/Detail?CountryType=ru-RU&boardNo=10031',
    ator:'https://www.ru.playblackdesert.com/News/Notice/Detail?CountryType=ru-RU&boardNo=8527',
    hyper:'https://www.ru.playblackdesert.com/News/Notice/Detail?boardNo=12739&boardType=2&countryType=ru-RU',
    hyperGuide:'https://www.ru.playblackdesert.com/News/Notice/Detail?boardNo=12697&boardType=3&countryType=ru-RU&currentPage=1',
    wiki:'https://www.ru.playblackdesert.com/Wiki/Default'
  };
  const groups=[
    {id:'start',icon:'01',title:'Начало пути',sub:'создание и первые часы',topics:[
      {id:'welcome',title:'Начать правильно',lead:'Три решения в начале экономят десятки часов: сезонный персонаж, удобный класс и Каменный зал древних.',goal:'Создать героя, которому не придётся переделывать старт.',tasks:['Создать именно сезонного персонажа','Выбрать сервер «Сезонный (Особый)»','Для первого прохождения выбрать Каменный зал древних','Записать фамилию семьи и имя персонажа'],body:`
        <div class="flow"><div class="flow-node"><b>Сезон</b><small>ускоренное развитие</small></div><span class="flow-arrow">→</span><div class="flow-node"><b>Каменный зал</b><small>понятный сюжет</small></div><span class="flow-arrow">→</span><div class="flow-node"><b>Медия</b><small>первая большая цель</small></div></div>
        <section class="section"><h2 class="section-title">Как выбрать класс</h2><div class="compare"><div><h3>Правильный критерий</h3><p>Нравится движение, анимации и ощущение ударов. Первый персонаж должен хотеться запускать каждый день.</p></div><div><h3>Плохой критерий</h3><p>«Самый сильный класс патча». Баланс меняется, а неудобное управление останется.</p></div></div></section>
        <div class="callout warn"><b>Не создавай обычного героя по привычке.</b>Сезонный персонаж получает отдельный сервер, подписку и прямой путь к Тувалле. Старого обязательного этапа с Нару больше нет.</div>`,sources:[['Официальный старт новичка',official.beginner],['Изменение пути экипировки · 18.12.2025',official.seasonNew]]},
      {id:'first-hour',title:'Первый час',lead:'Не пытайся понять всю игру сразу. Иди за Чёрным духом и настрой только то, что мешает.',goal:'Дойти до Велии без хаоса в инвентаре и интерфейсе.',tasks:['Завершить обучение','Призвать Чёрного духа клавишей /','Получить и активировать доступных питомцев','Забрать награды из Y, почты B и сезонной подписки'],body:`
        <section class="section"><h2 class="section-title">Что делать с предметами</h2><ul class="simple-list"><li><b>Серые трофеи</b> — продать кнопкой «Продать все трофеи».</li><li><b>Камни, советы, Кроны, Обрывки воспоминаний</b> — складывать; это ресурсы развития.</li><li><b>Сундук с выбором оружия или дорогой награды</b> — не открывать, пока не понял выбор.</li><li><b>Ивентовый предмет с таймером</b> — прочитать описание и срок.</li></ul></section>
        <div class="callout good"><b>Нормально не знать назначение предмета.</b>ПКМ часто показывает путь или НИП, а поиск в меню Esc находит нужную систему по названию.</div>`},
      {id:'ui',title:'Интерфейс без паники',lead:'В BDO почти всё находится через пять окон и поиск меню.',goal:'Научиться самостоятельно находить задания, награды, характеристики и маршрут.',tasks:['На 20 уровне включить все типы заданий в окне O','Открыть Esc и проверить строку поиска','Открыть P → Характеристики','Открыть M и найти информацию о локациях'],body:`
        <div class="grid"><div class="card"><h2>Главные клавиши</h2><p><span class="kbd">O</span> задания · <span class="kbd">Y</span> достижения · <span class="kbd">I</span> инвентарь · <span class="kbd">P</span> персонаж · <span class="kbd">M</span> карта · <span class="kbd">/</span> Чёрный дух · <span class="kbd">G</span> гильдия.</p></div><div class="card"><h2>Если потерялся</h2><p>Открой <b>Esc → Поиск</b>, введи название функции. Это быстрее, чем запоминать расположение десятков кнопок.</p></div></div>
        <div class="callout warn"><b>После 20 уровня включи «Все задания».</b>Иначе часть полезных ремесленных и побочных заданий будет просто невидима.</div>`},
      {id:'story',title:'Основной сюжет',lead:'Первое прохождение лучше вести по истории мира: оно открывает механики, знания, энергию и полезные награды.',goal:'Закрыть Медию, затем открыть самые важные аккаунтные удобства.',tasks:['Пройти Баленос → Серендию → Кальфеон → Медию','На 56 уровне пройти Наследие и Пробуждение','Не откладывать Магнус после открытия цепочки','Позже продолжить региональные сюжеты и Рекомендуемые задания'],body:`
        <section class="section"><h2 class="section-title">Порядок без перегруза</h2><div class="flow"><div class="flow-node"><b>Баленос</b><small>основы</small></div><span class="flow-arrow">→</span><div class="flow-node"><b>Серендия</b><small>мир и системы</small></div><span class="flow-arrow">→</span><div class="flow-node"><b>Кальфеон</b><small>контент</small></div><span class="flow-arrow">→</span><div class="flow-node"><b>Медия</b><small>56 уровень</small></div><span class="flow-arrow">→</span><div class="flow-node"><b>Магнус</b><small>склады и телепорты</small></div></div></section>
        <section class="guide-section"><h2 class="section-title">Что именно даёт сюжет</h2><div class="how-grid"><div class="how-card"><b>Системы</b><small>Открывает механики, рекомендуемые задания, регионы и цепочки дневников.</small></div><div class="how-card"><b>Сила семьи</b><small>Региональные линии дают знания, энергию, влияние и постоянные характеристики аккаунта.</small></div><div class="how-card"><b>Пять питомцев</b><small>Баленос, Серендия, Кальфеон, Медия и Валенсия содержат бесплатные награды-питомцев.</small></div><div class="how-card"><b>Серебро и материалы</b><small>Для нового аккаунта сюжетные слитки, расходники и расширения особенно ценны.</small></div><div class="how-card"><b>Доступ к контенту</b><small>Магнус, дневники и поздние зоны часто требуют завершённый регион или конкретное знание.</small></div><div class="how-card"><b>Ориентирование</b><small>Сюжет знакомит с городами, складами, НИП и узлами без отдельного изучения карты.</small></div></div></section>
        <section class="guide-section"><h2 class="section-title">Полный порядок после Медии</h2><div class="mini-route"><span>Валенсия</span><i>→</i><span>Камасильвия</span><i>→</i><span>Дриган</span><i>→</i><span>Одиллита</span><i>→</i><span>Горы вечной зимы</span><i>→</i><span>Магнус</span><i>→</i><span>Страна Утра и Сеул</span><i>→</i><span>Улу-Кита</span><i>→</i><span>Идания</span></div><p>Это порядок выхода из Razorback, а не запрет на перестановку. Если зона требует слишком много атаки или сюжеты предлагают уравнивание, читай условия конкретной цепочки и возвращайся позже.</p><div class="completion"><b>Сюжетный этап закрыт, если:</b> Медия завершена, оба стиля боя открыты, Магнус доступен или пройден, а в <span class="kbd">O</span> ты понимаешь разницу между вкладками «Основные» и «Рекомендуемые».</div></section>`,sources:[['Razorback · Основные квесты','https://vk.com/@mavrein-main-quests'],['Razorback · Советы новичкам','https://vk.com/@mavrein-newbie']]}
    ]},
    {id:'season',icon:'02',title:'Сезон и Тувалла',sub:'первая экипировка',topics:[
      {id:'naru-tuvala',title:'Тувалла: получить и усилить',lead:'С 18 декабря 2025 года обязательный этап Нару убран. Новичок сразу собирает Туваллу — основную учебную экипировку.',goal:'Получить полный используемый комплект Туваллы и последовательно усилить его без лишних трат.',tasks:['Забирать части Туваллы по основной цепочке заданий','Если части не хватает — проверить кузнеца или торговца экипировкой в ближайшем городе','Сначала усилить оружие выбранного стиля, затем дополнительное оружие и броню','Перед дорогими попытками открыть подробный раздел «Усиление без страха»'],body:`
        <div class="visual-strip"><div class="visual-tile"><span class="visual-icon">📜</span><b>1. Получить</b><small>Основной сюжет выдаёт Туваллу по мере прохождения.</small></div><div class="visual-tile"><span class="visual-icon">⚒️</span><b>2. Докупить</b><small>Недостающую обычную часть ищи у кузнеца или торговца экипировкой.</small></div><div class="visual-tile"><span class="visual-icon">⬆️</span><b>3. Усилить</b><small>Используй материалы, которые показывает текущее окно усиления.</small></div><div class="visual-tile"><span class="visual-icon">🧰</span><b>4. Починить</b><small>«Фрагмент времени» нужен для восстановления максимальной прочности и обменов.</small></div></div>
        <div class="callout good"><b>Что изменилось.</b>Нару удалена из актуального маршрута. Тувалла теперь является обычным снаряжением и доступна не только внутри старой сезонной схемы.</div>
        <section class="section"><h2 class="section-title">Простой приоритет</h2><div class="flow"><div class="flow-node"><b>Тувалла</b><small>получить комплект</small></div><span class="flow-arrow">→</span><div class="flow-node"><b>Стиль боя</b><small>выбрать оружие</small></div><span class="flow-arrow">→</span><div class="flow-node"><b>Усиление</b><small>понять шанс и прочность</small></div><span class="flow-arrow">→</span><div class="flow-node"><b>Выпуск</b><small>сверить чек-лист</small></div></div><ol class="simple-list"><li>Основное или пробуждённое оружие — под выбранный стиль.</li><li>Дополнительное оружие.</li><li>Четыре части брони.</li><li>Аксессуары и второй комплект оружия.</li></ol></section>
        <div class="callout warn"><b>Не ориентируйся на старые гайды с обменом Нару V → Тувалла I.</b>Это устаревшая схема. Смотри подсказку источника предмета и состав материалов прямо в актуальном интерфейсе игры.</div>`,sources:[['Изменение пути экипировки · 18.12.2025',official.seasonNew],['Официальное руководство по экипировке',official.gear]]},
      {id:'enhance',title:'Усиление без страха',lead:'Перед любой попыткой разбираем пять вещей: материал, шанс, последствия неудачи, прочность и цену страховки.',goal:'Самостоятельно открыть окно усиления, выбрать разумный шанс и заранее знать, что произойдёт при успехе и неудаче.',tasks:['Открыть / → Улучшение и выбрать предмет','Проверить материал и итоговую ступень','Прочитать последствия неудачи','Выбрать шанс из Нити Надера','Решить, нужны ли Кроны','После серии попыток восстановить максимальную прочность'],body:`
        <section class="guide-section"><h2 class="section-title">Что ты видишь в окне <span class="kbd">/</span> → Улучшение</h2><div class="how-grid"><div class="how-card"><b>Предмет</b><small>То, что усилится. Проверь название и текущую ступень дважды.</small></div><div class="how-card"><b>Материал</b><small>Камень, эссенция или другой расходник; игра показывает точное количество.</small></div><div class="how-card"><b>Шанс</b><small>Процент успеха формируется из базового шанса и накопленного усиления.</small></div><div class="how-card"><b>Неудача</b><small>Красная строка сообщает: потеря прочности, понижение или уничтожение.</small></div><div class="how-card"><b>Кроны</b><small>Страхуют только указанные последствия и расходуются при попытке.</small></div><div class="how-card"><b>Результат</b><small>Будущая ступень и характеристики после успеха.</small></div></div><div class="gallery"><img src="assets/screens/enhance-empty.png" alt="Пустое окно усиления"><img src="assets/screens/repair.png" alt="Окно восстановления максимальной прочности"></div></section>
        <section class="guide-section"><h2 class="section-title">Одна безопасная попытка — по шагам</h2><ol class="instruction-list"><li>Сними предмет, если интерфейс не позволяет выбрать надетый, и положи его в инвентарь.</li><li>Открой <span class="kbd">/</span> → <b>Улучшение</b>, выбери предмет и требуемый материал.</li><li>Посмотри не только процент, но и красное предупреждение о неудаче.</li><li>Открой список шансов: возьми подходящий Совет Валкса или значение из Нити Надера. Не трать шанс 200+ на дешёвую Туваллу.</li><li>Включай Кроны только после сравнения их цены с ценой предмета и материалов.</li><li>Нажми усиление один раз. После результата снова проверь ступень, прочность и новый шанс — не кликай серией вслепую.</li></ol><div class="callout warn"><b>Главное правило.</b>Если ты не можешь вслух сказать, что потеряешь при неудаче, кнопку нажимать рано.</div></section>
        <section class="guide-section"><h2 class="section-title">Шанс, Совет Валкса и Нить Надера</h2><div class="compare"><div><h3>Совет Валкса</h3><p>Одноразово устанавливает значение усиления. Используй совет, близкий к нужной ступени, а не самый большой.</p></div><div><h3>Нить Надера</h3><p>Хранит несколько уже подготовленных значений. Перекладывай шанс между персонажем и ячейкой, чтобы не потерять его на дешёвой попытке.</p></div></div><ol class="instruction-list"><li>Открой Нить Надера в окне усиления.</li><li>Если текущий шанс слишком велик для предмета, положи его в свободную ячейку.</li><li>Возьми меньший шанс или начни новый.</li><li>После неудачи шанс обычно растёт — снова оцени, подходит ли он следующей попытке.</li></ol></section>
        <section class="guide-section"><h2 class="section-title">Что происходит с разными предметами</h2><table class="compact-table"><thead><tr><th>Тип</th><th>Обычный риск</th><th>Что делает новичок</th></tr></thead><tbody><tr><td>Оружие и броня</td><td>Падает максимальная прочность; на высоких ступенях возможно понижение</td><td>Заранее готовит материалы ремонта и читает строку Кронов</td></tr><tr><td>Обычный аксессуар</td><td>Без защиты обычно уничтожаются и основа, и копия</td><td>Усиливает запасной предмет, не единственный надетый</td></tr><tr><td>Харзат</td><td>Не уничтожается, но теряет 20 макс. прочности и может понижаться</td><td>Готовит Обрывки воспоминаний и отдельный шанс</td></tr><tr><td>Тувалла</td><td>Дешевле восстановить и повторить</td><td>Не расходует редкие Кроны без особой причины</td></tr></tbody></table></section>
        <section class="guide-section"><h2 class="section-title">Как вернуть максимальную прочность</h2><ol class="instruction-list"><li>Подойди к любому кузнецу → <b>Ремонт → Восстановить макс. прочность</b>.</li><li>Слева выбери повреждённый предмет.</li><li>Справа выбери материал: копию предмета или Обрывки воспоминаний — интерфейс покажет, сколько прочности вернётся.</li><li>Не путай обычный ремонт до текущего максимума с восстановлением самого максимума.</li></ol><div class="completion"><b>Раздел пройден:</b> ты умеешь сделать одну попытку, сохранить слишком высокий шанс в Нити Надера и восстановить максимальную прочность без поиска стороннего видео.</div></section>`,sources:[['Razorback · Улучшение снаряжения','https://vk.com/@mavrein-zato4ka'],['Официальные основы усиления',official.enhance],['Официальное руководство Харзата',official.kharazad]]},
      {id:'combat-style',title:'56-й уровень: выбрать стиль боя',lead:'Большинство классов после 56 уровня выбирает Наследие или Пробуждение.',goal:'Пройти обе цепочки, попробовать оба стиля и выбрать удобный.',tasks:['Достичь 56 уровня','У Чёрного духа пройти цепочку Пробуждения','Затем пройти цепочку Наследия','Настроить навыки, быстрые слоты и простой PvE-комбо'],body:`
        <div class="compare"><div><h3>Наследие</h3><p>Развивает стиль основного оружия. Его урон сильнее зависит от основного оружия.</p></div><div><h3>Пробуждение</h3><p>Открывает отдельное оружие и новый набор навыков. Урон сильнее зависит от пробуждённого оружия.</p></div></div>
        <section class="guide-section"><h2 class="section-title">Как честно сравнить стили</h2><ol class="instruction-list"><li>Заверши обе цепочки у Чёрного духа и сохрани отдельный пресет навыков для каждого варианта.</li><li>Надень сопоставимое оружие и одинаковые кристаллы/расходники. Сравнение с разной экипировкой бессмысленно.</li><li>На тренировочном манекене найди: вход в бой, усиления, защитные навыки, основной урон и выход из опасной зоны.</li><li>Сделай по 10–15 минут на знакомом споте каждым стилем. Смотри не только скорость, но и здоровье, ошибки и усталость рук.</li><li>Выбери стиль и только после этого подтверждай награду оружия поддержки: Наследию обычно важнее основное, Пробуждению — пробуждённое.</li></ol><div class="callout good"><b>Выбирай по удобству.</b>Для первого героя стабильное простое комбо полезнее теоретически максимального урона сложного стиля.</div><div class="completion"><b>Выбор сделан, если:</b> ты можешь без подсказки начать бой, наложить усиления, выполнить основное комбо и безопасно отойти.</div></section>`,sources:[['Официальный путь новичка',official.beginner]]},
      {id:'season-exit',title:'Чек-лист перед выпуском',lead:'Выпуск необратим. Подготовь персонажа и забери всё сезонное заранее.',goal:'Покинуть сезон без потерянных наград и недоделанной экипировки.',tasks:['Полный используемый круг Туваллы V','Получены все награды сезонной подписки','Персонаж достиг 61 уровня','Забраны сезонные достижения Y и подарки Фугара','Потрачены или обменены удаляемые сезонные материалы'],body:`
        <div class="callout warn"><b>После выпуска вернуться нельзя.</b>Обычный персонаж не войдёт на сезонный сервер, а лишнее сезонное снаряжение и часть материалов удаляются по правилам выпуска.</div>
        <section class="guide-section"><h2 class="section-title">Проверка по окнам</h2><ol class="instruction-list"><li><b>Экипировка:</b> надень весь рабочий комплект и убедись, что нужные оружие, броня и аксессуары доведены до целевой ступени.</li><li><b>Подписка:</b> прокрути сезонную шкалу до конца и нажми получение каждой открытой награды.</li><li><b>Достижения <span class="kbd">Y</span>:</b> забери уровень, время входа и сезонные подарки.</li><li><b>Фугар и Чёрный дух:</b> заверши доступные сезонные цепочки и обмены, проверь неотданные предметы заданий.</li><li><b>Инвентарь и склады:</b> наведи на каждый сезонный материал и прочитай строку об удалении/сроке. Сначала обменяй то, что исчезнет.</li><li><b>После выпуска:</b> заранее знай первую цель — поддержка развития, Магнус или обычный аукцион.</li></ol><div class="completion"><b>Выпуск готов, если:</b> в подписке нет красных точек, сезонные задания не дают полезной награды, а следующая цель требует обычного статуса.</div><p>Если сомневаешься — не спеши. Выпуск нужен тогда, когда сезон уже перестал давать полезные цели.</p></section>`,sources:[['Официальные условия выпуска',official.graduation]]}
    ]},
    {id:'after',icon:'03',title:'После выпуска',sub:'бесплатная сила аккаунта',topics:[
      {id:'graduation',title:'Первые действия',lead:'После выпуска не покупай случайные улучшения. Сначала собери бесплатные и одноразовые награды.',goal:'Открыть ветку поддержки развития и понять три главные награды.',tasks:['Надеть преобразованную обычную Туваллу','Проверить Y, Подписку развития и задания Чёрного духа','Начать «[Поддержка развития] Помощь Фугара»','Не выбирать дорогую награду без сравнения вариантов'],body:`
        <section class="section"><h2 class="section-title">Три отдельные ветки Туваллы VI–X</h2><div class="flow"><div class="flow-node"><b>Оружие X</b><small>Чёрная звезда V</small></div><div class="flow-node"><b>Броня X</b><small>Усыпальница: Молчание</small></div><div class="flow-node"><b>Аксессуар X</b><small>Харзат IV</small></div></div></section>
        <section class="guide-section"><h2 class="section-title">Первые 30 минут после выпуска</h2><ol class="instruction-list"><li>Надень обычную версию Туваллы и проверь, что все слоты остались рабочими.</li><li>Открой <span class="kbd">Y</span>, Подписку развития и Чёрного духа: сначала забери бесплатное, только затем открывай аукцион.</li><li>Найди <b>[Поддержка развития] Помощь Фугара</b>. Ветки оружия, брони и аксессуара независимы и используют соответствующую Туваллу.</li><li>VI создаётся гарантированно Эссенцией восхождения. Для следующих ступеней читай материал и шанс в окне — не переноси правила одной ветки на другую.</li><li>До передачи Туваллы X выбери точный слот конечной награды: решение аккаунтное и влияет на дальнейший маршрут.</li></ol><div class="callout warn"><b>Не выбирай по картинке сундука.</b>Сначала открой подробные вкладки оружия, брони и аксессуаров, сравни уже имеющиеся предметы и цену дубликата.</div><div class="completion"><b>Этап завершён, если:</b> три ветки поддержки видны, для каждой выбран конечный слот, а серебро ещё не потрачено на случайную промежуточную вещь.</div></section>`,sources:[['Актуальная поддержка развития',official.support]]},
      {id:'support-choice',title:'Как выбрать награды Фугара',lead:'Бесплатная награда должна закрывать самый дорогой или самый важный для твоей сборки слот.',goal:'Получить Чёрную звезду V, одну броню Усыпальницы и Харзат IV без сожалений.',tasks:['Определить Наследие или Пробуждение до выбора оружия','Сравнить стоимость четырёх вариантов брони','Сравнить стоимость и пользу видов аксессуаров','Зафиксировать выбранные слоты до передачи Туваллы X'],body:`
        <div class="grid"><div class="card"><h2>Оружие</h2><p>Для Наследия обычно первым закрывают основное, для Пробуждения — пробуждённое. Дополнительное важно обоим, но выбор зависит от уже полученных наград.</p></div><div class="card"><h2>Броня и аксессуар</h2><p>Выбирай не «по чужому шаблону», а по цене и сложности получения на текущем рынке. Ситуация меняется — проверяй аукцион перед подтверждением.</p></div></div>
        <div class="callout warn"><b>Передача Туваллы X завершает ветку.</b>Сними кристаллы и внимательно прочитай название выбранного предмета в окне награды.</div>`,sources:[['Официальная таблица наград',official.support]]},
      {id:'magnus',title:'Магнус: пройти как можно раньше',lead:'Это не просто сюжет: Магнус соединяет склады, открывает быстрые перемещения и даёт броню босса V.',goal:'Открыть аккаунтные удобства, которыми будешь пользоваться постоянно.',tasks:['Принять основную цепочку Abyss One: Магнус','Открывать артерии бездны по мере прохождения','Завершить всю цепочку','Осознанно выбрать одну броню босса V'],body:`
        <div class="compare"><div><h3>Склады</h3><p>Через кладовщика и горничных можно работать со складами открытых регионов.</p></div><div><h3>Перемещение</h3><p>Колодцы связывают крупные регионы за серебро и сильно сокращают дорогу.</p></div></div>
        <section class="guide-section"><h2 class="section-title">Как пройти без потери нити</h2><ol class="instruction-list"><li>У Чёрного духа прими <b>[Abyss One] Магнус</b> и иди к указанному колодцу. Если задания нет, проверь уровень и завершение требуемого основного региона.</li><li>Внутри Магнуса выбирай текущую Бездну по маркеру. Каждое испытание — небольшая отдельная головоломка; экипировка редко является главным препятствием.</li><li>После решения вернись к Ву Джу и обязательно заверши диалог — только так фиксируется прогресс и открывается следующая артерия.</li><li>Проверяй новые точки перемещения по мере открытия регионов. Колодец работает как вход, а выход выбирается в интерфейсе артерий.</li><li>После финала проверь любого кладовщика: список региональных складов должен стать доступен. Затем забери единственный сундук брони босса V.</li></ol></section><section class="guide-section"><h2 class="section-title">Как выбрать броню босса V</h2><div class="how-grid"><div class="how-card"><b>Не бери дубликат</b><small>Сначала посмотри, какой слот уже закроет поддержка развития или другой сундук.</small></div><div class="how-card"><b>Сравни конечную ветку</b><small>Шлем, доспех, перчатки и обувь превращаются в разные части Усыпальницы времен.</small></div><div class="how-card"><b>Проверь сборку класса</b><small>Для обуви и перчаток особенно важен выбранный тип защиты; не копируй чужой набор вслепую.</small></div></div><div class="callout good"><b>Награда аккаунта.</b>За полное прохождение можно один раз выбрать броню босса V. Она не продаётся, но подходит для дальнейшего развития.</div><div class="completion"><b>Магнус завершён, если:</b> склады регионов связаны, открытые колодцы перемещают между регионами, а сундук брони выбран без дублирования слота.</div></section>`,sources:[['Официальный гайд по Магнусу',official.magnus],['Razorback · Советы новичкам','https://vk.com/@mavrein-newbie']]},
      {id:'utility-quests',title:'Полезные задания',lead:'Эти цепочки дают не урон на бумаге, а удобство каждого игрового дня. Здесь собраны не названия, а путь: где искать, зачем делать и что получить.',goal:'Открыть базовые аккаунтные системы и полезные специальные инвентари до долгого фарма.',tasks:['В O → Рекомендуемые найти цепочки феи, лагеря и Нити Надера','Открыть инвентарь аккаунта и бесплатные расширения обычного инвентаря','Сохранить в цели бесконечный камень жизни, книгу Кафраса и огороды','Для рыбалки получить Чудесный аквариум Сим Чон','Проверить сумку семян Кеуло, аксессуар Флорин и сумку моряка'],body:`
        <div class="visual-strip"><div class="visual-tile"><span class="visual-icon">🧚</span><b>Фея</b><small>автоматизация зелий и ежедневное удобство</small></div><div class="visual-tile"><span class="visual-icon">⛺</span><b>Лагерь</b><small>ремонт, магазин и полезные функции вдали от города</small></div><div class="visual-tile"><span class="visual-icon">🧵</span><b>Нить Надера</b><small>хранение разных шансов усиления</small></div><div class="visual-tile"><span class="visual-icon">🎒</span><b>Инвентарь семьи</b><small>общие предметы для персонажей аккаунта</small></div></div>
        <section class="guide-section"><h2 class="section-title">Как находить любую полезную цепочку</h2><ol class="instruction-list"><li>На 20 уровне открой <span class="kbd">O</span> и включи фильтр <b>«Все задания»</b>.</li><li>Перейди во вкладку <b>«Рекомендуемые»</b> и введи часть названия награды: «фея», «лагерь», «Надер», «инвентарь» или «аквариум».</li><li>Если цепочки нет, наведи на неё курсор и проверь условие: уровень, завершённый регион или предыдущее задание.</li><li>ПКМ по заданию строит маршрут. Если НИП далеко, сначала проверь Магнус и транспорт.</li></ol></section>
        <section class="guide-section"><h2 class="section-title">Чудесный аквариум Сим Чон — полностью</h2><div class="item-showcase"><div class="item-card"><span class="visual-icon" aria-hidden="true">🐟</span><div><b>Чудесный аквариум Сим Чон</b><span class="item-id">50 слотов · ID 760687</span><a href="https://bdocodex.com/ru/item/760687/" target="_blank" rel="noopener">Сверить предмет и ID ↗</a><small class="muted">Игровой вид показан на скриншоте Razorback ниже; символ слева — только маркер раздела.</small></div></div></div><div class="how-grid"><div class="how-card"><b>Зачем</b><small>Рыба автоматически попадает в отдельные 50 слотов и портится значительно медленнее.</small></div><div class="how-card"><b>Что требуется</b><small>Знание «Сказание о Сим Чон» и доступ к Подводному дворцу.</small></div><div class="how-card"><b>Где начать</b><small>O → Рекомендуемые → категория про Чудесный аквариум; начальный НИП — Дорио.</small></div></div><ol class="instruction-list"><li>Сначала пройди цепочку <b>«Сказание о Сим Чон»</b> из 13 заданий. Она начинается у Сим Бонсы и даёт обязательное знание.</li><li>Открой цепочку <b>«[Чудесный аквариум] Нежданная встреча»</b> у Дорио в Подводном дворце.</li><li>Выполни задания Дорио: разговоры и рыбалка. В первом шаге потребуется поймать рыбу зелёного ранга.</li><li>Когда цепочка приведёт к Сим Чон, заверши «На память от Сим Чон» и «Вещица на память».</li><li>Получив аквариум, держи его в обычном инвентаре и активируй ПКМ. Свежая пойманная рыба начнёт попадать внутрь автоматически.</li></ol><div class="callout warn"><b>Почему задание может не завершаться.</b>Чаще всего отсутствует знание «Сказание о Сим Чон». Вернись к цепочке 8753 и только потом продолжай аквариум.</div><div class="figure-grid"><figure class="guide-figure"><img loading="lazy" src="https://sun9-37.userapi.com/s/v1/ig2/HTw2_sSEvUcQuyGy-8VFkHvd85Z1kjXTZ7uwtzfE3QSHDd1PIyeMBnPrla3A3oqqNlQn5QaMqjajS_d-nBl58pGZ.jpg?quality=95&amp;as=32x9,48x14,72x21,108x31,160x46,240x69,360x103,480x137,540x154,640x183&amp;from=bu&amp;cs=72x0" alt="Цепочка получения аквариума в гайде Razorback"><figcaption>Где искать цепочку аквариума. Изображение из Razorback JSON.</figcaption></figure><figure class="guide-figure"><img loading="lazy" src="https://sun9-63.userapi.com/s/v1/ig2/Xw6yt9D34eFVOGfVpVHmeN2aSmx_0B9OswL8zFT-M8PZLrz6-tAl47dIGB0CYN5pg15DkuyNV4fVHacQLD6nVShK.jpg?quality=95&amp;as=32x53,48x80,72x119,108x179,160x265,240x398,348x577&amp;from=bu&amp;cs=72x0" alt="Чудесный аквариум Сим Чон в гайде Razorback"><figcaption>Внешний вид и описание награды. Изображение из Razorback JSON.</figcaption></figure></div><div class="route-gate"><span><b>Этап завершён:</b> аквариум активирован, внутри видно 50 слотов, а следующая пойманная рыба появилась в нём автоматически.</span></div><p class="razor-note">Опционально: купленный в F3 «Чудесный аквариум Крио» можно объединить с аквариумом Сим Чон через <b>L → Производство</b> и получить 100 слотов. Это платное расширение, для прохождения гайда оно не требуется.</p></section>
        <section class="guide-section"><h2 class="section-title">Что оставить на потом, но не забыть</h2><div class="how-grid"><div class="how-card"><b>Бой</b><small>Бесконечный камень жизни, фея, лагерь, Нить Надера.</small></div><div class="how-card"><b>Аккаунт</b><small>Инвентарь семьи, книга Кафраса, расширения инвентаря.</small></div><div class="how-card"><b>Ремесло</b><small>Огороды, сумка семян Кеуло, аксессуар Флорин, аквариум, сумка моряка.</small></div></div></section>`,sources:[['Razorback · Полезные квесты','https://vk.com/@mavrein-quest-tips'],['Официальная база знаний',official.wiki],['Официальное добавление аквариума','https://www.ru.playblackdesert.com/News/Notice/Detail?CountryType=ru-RU&boardNo=8121']]}
    ]},
    {id:'combat',icon:'04',title:'Бой и фарм',sub:'как не умереть и зарабатывать',topics:[
      {id:'stats',title:'Понять характеристики',lead:'Цифра атаки в инвентаре — не весь твой урон. Для спота важны итоговые показатели против монстров.',goal:'Выбирать локацию по реальной силе, а не по одной красивой цифре.',tasks:['Открыть P → Характеристики','Найти итоговую атаку и защиту','Открыть Esc → Информация о локациях','Выбрать место не выше своего итогового диапазона'],body:`
        <div class="visual-strip"><div class="visual-tile"><span class="visual-icon">🏃</span><b>Выносливость</b><small>растёт от перемещения пешком и увеличивает запас выносливости</small></div><div class="visual-tile"><span class="visual-icon">💪</span><b>Сила</b><small>развивается переносом груза и увеличивает допустимый вес</small></div><div class="visual-tile"><span class="visual-icon">❤️</span><b>Здоровье</b><small>развивается едой и повышает запас здоровья</small></div></div>
        <div class="compare"><div><h3>Отображаемая атака</h3><p>Основная цифра снаряжения. Она участвует в бонусных порогах.</p></div><div><h3>Итоговая атака</h3><p>Сумма экипировки, бонусов против монстров, кристаллов, еды, светящихся камней и других эффектов.</p></div></div>
        <div class="callout warn"><b>Если монстры «не умирают» — уйди ниже.</b>Медленный круг означает меньше серебра и больше риска, даже если формально вход разрешён.</div>`,sources:[['Razorback · Характеристики новичка','https://vk.com/@mavrein-stats']]},
      {id:'crystals',title:'Кристаллы и светящиеся камни',lead:'Это большая часть скрытой силы. Пустые слоты — потерянные характеристики.',goal:'Собрать дешёвый безопасный PvE-набор и сохранить пресет.',tasks:['Открыть меню инкрустации и проверить пустые слоты','Собрать базовый PvE-пресет без дорогих кристаллов','Установить две реликвии','Собрать подходящую комбинацию светящихся камней'],body:`
        <section class="guide-section"><h2 class="section-title">Три разные системы</h2><div class="compare"><div><h3>Кристаллы</h3><p>Ставятся в общий пресет инкрустации и дают прямые характеристики. При некоторых PvE-смертях могут разрушаться.</p></div><div><h3>Реликвии</h3><p>Два надеваемых предмета с базовыми статами и по два слота светящихся камней.</p></div><div><h3>Светящиеся камни</h3><p>Четыре камня внутри двух реликвий. Правильная комбинация открывает дополнительный комплектный эффект.</p></div><div><h3>Пресет</h3><p>Сохранённый набор, который можно включать целиком. Давай ему название по назначению.</p></div></div></section><section class="guide-section"><h2 class="section-title">Первый безопасный PvE-набор</h2><ol class="instruction-list"><li>Проверь лимиты скорости атаки/навыков, передвижения и критического удара. Сначала закрой комфортные базовые значения.</li><li>Добавь атаку против монстров и меткость. Если удары часто промахиваются, чистая атака не решит проблему.</li><li>Оставшиеся слоты используй на HP, снижение урона или сопротивления под конкретный спот.</li><li>Покупай дешёвые версии и сделай два тестовых круга. Дорогие кристаллы ставь только после проверки выживаемости.</li><li>Для светящихся камней сначала выбери название нужной комбинации, затем покупай четыре точных компонента — случайный набор не даст комплектный эффект.</li></ol><div class="how-grid"><div class="how-card"><b>Обычное PvE</b><small>Атака по монстрам, меткость, скорость и базовая защита.</small></div><div class="how-card"><b>Опасный спот</b><small>Больше HP и снижения урона; дорогие кристаллы вводятся постепенно.</small></div><div class="how-card"><b>Ремесло</b><small>Отдельные реликвии и камни на мастерство/опыт; не смешивай с боевым пресетом.</small></div></div><div class="callout good"><b>Сохраняй пресеты по назначению.</b>Один для обычного PvE, другой позже для боссов или ремесла. Название пресета должно объяснять, где его включать.</div></section>`},
      {id:'buffs',title:'Расходники и цикл фарма',lead:'Хороший фарм начинается до первого монстра: баффы, питомцы, вес и свободные слоты.',goal:'Создать повторяемый цикл без лишних остановок.',tasks:['Включить подходящую еду и эликсир/парфюм','Проверить питомцев и шанс получения трофеев','Освободить вес и инвентарь','Запустить Агрис и свиток дропа только там, где это выгодно'],body:`
        <section class="guide-section"><h2 class="section-title">Проверка перед первым монстром</h2><div class="how-grid"><div class="how-card"><b>Еда</b><small>Обычный ужин Крон — понятная базовая еда. Более дорогой вариант нужен только под конкретную цель.</small></div><div class="how-card"><b>Алхимия</b><small>Эликсир/парфюм выбирается по урону и выживаемости. Не смешивай несовместимые группы эффектов.</small></div><div class="how-card"><b>Питомцы</b><small>Призови всех, выставь подходящее поведение и проверь скорость подбора до запуска свитка.</small></div><div class="how-card"><b>Фея</b><small>Настрой автоматическое зелье и разрешённые расходники. Проверь, что нужные предметы лежат в доступном инвентаре.</small></div><div class="how-card"><b>Вес и слоты</b><small>Убери лишнее, возьми горничных или лошадь для трофеев. Перегрузка ломает круг и доход.</small></div><div class="how-card"><b>Агрис и шанс трофеев</b><small>Запускай только если спот эффективно расходует очки и основная ценность добычи зависит от количества трофеев.</small></div></div></section><section class="guide-section"><h2 class="section-title">Один измеримый час</h2><ol class="instruction-list"><li>Запиши начальные очки Агриса, серебро и число свитков.</li><li>Включи расходники непосредственно перед первым кругом и поставь таймер на 60 минут.</li><li>Не меняй маршрут посередине теста. Отмечай смерти, перегрузку и остановки питомцев.</li><li>После часа продай только обычные трофеи, отдельно оцени редкие выпадения и вычти стоимость расходников.</li><li>Сравни не только серебро, но и комфорт. Стабильный безопасный спот часто выгоднее сложного.</li></ol><div class="callout warn"><b>Не включай всё подряд.</b>Редкие свитки и дорогие эликсиры должны окупаться ценностью добычи.</div></section>`},
      {id:'death',title:'Смерть и безопасность',lead:'Потеря времени неприятна, потеря дорогих кристаллов — намного неприятнее.',goal:'Знать риски до сложного спота и открытого PvP.',tasks:['Проверить штрафы выбранной локации','Не входить в опасный спот с дорогими кристаллами без теста','Носить подходящие зелья и Слёзы Эллиан','Следить за кармой и сервером Арша'],body:`<section class="guide-section"><h2 class="section-title">Перед новым спотом</h2><ol class="instruction-list"><li>Сними самые дорогие кристаллы или включи дешёвый тестовый пресет.</li><li>Возьми зелья и несколько Слёз Эллиан, освободи быстрый слот возрождения.</li><li>Сделай один круг без редких свитков. Если HP резко падает, проверь итоговую защиту, сопротивления и атаки босса/элитного монстра.</li><li>Не стой на месте после возрождения: сначала отойди в безопасную точку, восстановись и только затем продолжай.</li></ol><div class="compare"><div><h3>Обычное PvE</h3><p>При некоторых смертях возможна потеря опыта и разрушение кристаллов. Конкретные исключения и защита зависят от контента.</p></div><div><h3>Разломы тьмы</h3><p>Смерть от босса Разлома не даёт обычного штрафа — можно учить механику без риска кристаллов.</p></div><div><h3>Арша и открытое PvP</h3><p>Это среда повышенного конфликта. Не используй её для первого знакомства со спотом.</p></div><div><h3>Отрицательная карма</h3><p>Добавляет серьёзные риски экипировке и возрождению. Новичку лучше не атаковать игроков без понимания системы.</p></div></div><div class="completion"><b>Возвращай дорогой пресет, когда:</b> два тестовых круга пройдены без критических просадок, понятны опасные атаки и есть запас лечения.</div></section>`}
    ]},
    {id:'gear',icon:'05',title:'Экипировка',sub:'от Туваллы до эндгейма',topics:[
      {id:'gear-road',title:'Карта развития',lead:'Не улучшай все слоты одинаково. Сначала бесплатные скачки силы, затем самый дешёвый полезный прирост.',goal:'Видеть конечный путь и покупать только следующий разумный шаг.',tasks:['Получить три награды поддержки развития','Собрать стабильный комплект для своего спота','Считать цену одного очка полезной атаки/защиты','Держать резерв серебра вместо покупки «в ноль»'],body:`
        <div class="flow"><div class="flow-node"><b>Тувалла V/X</b><small>старт</small></div><span class="flow-arrow">→</span><div class="flow-node"><b>Чёрная звезда V</b><small>оружие</small></div><span class="flow-arrow">→</span><div class="flow-node"><b>Усыпальница</b><small>броня</small></div><span class="flow-arrow">→</span><div class="flow-node"><b>Харзат</b><small>аксессуары</small></div><span class="flow-arrow">→</span><div class="flow-node"><b>Вана / Идан</b><small>поздняя игра</small></div></div>
        <div class="callout good"><b>Принцип покупки.</b>Сравни несколько улучшений и выбери то, которое даёт нужный порог спота дешевле, не ломая весь запас серебра.</div>`},
      {id:'weapons',title:'Оружие: от Туваллы до Вана',lead:'Закрываем каждый слот по цепочке: сначала рабочая Тувалла, затем Чёрная звезда V, и только после полного понимания рецепта — Оружие Вана.',goal:'Получить подходящие основное, пробуждённое и дополнительное оружие, не потратив редкую награду на неправильный слот.',tasks:['Определить стиль: основная стойка или пробуждение','Довести используемые оружия Туваллы до V/X','Получить первую Чёрную звезду V из поддержки','Закрыть нужные слоты Чёрной звездой V','Выбрать рецепт Вана только после сбора всех компонентов','Усилить Вана и зарегистрировать подходящие камни закалки'],body:`
        <div class="item-showcase"><div class="item-card"><img src="assets/items/blackstar.webp" alt="Сундук с оружием Чёрной звезды V на выбор"><div><b>Сундук с оружием Чёрной звезды (V) на выбор</b><span class="item-id">ID 767078</span><a href="https://bdocodex.com/ru/item/767078/" target="_blank" rel="noopener">Название, вид и ID ↗</a></div></div><div class="item-card"><img src="assets/items/origin.webp" alt="Пламя Начала"><div><b>Пламя Начала</b><span class="item-id">ID 767076</span><a href="https://bdocodex.com/ru/item/767076/" target="_blank" rel="noopener">Название, вид и ID ↗</a></div></div></div>
        <section class="guide-section"><h2 class="section-title">0. Сначала выбери боевую стойку</h2><div class="how-grid"><div class="how-card"><b>Основная стойка</b><small>Навыки до пробуждения. Главный урон сильнее зависит от основного оружия.</small></div><div class="how-card"><b>Пробуждение</b><small>Открывается после задания пробуждения. Главный урон сильнее зависит от пробуждённого оружия.</small></div><div class="how-card"><b>Дополнительное</b><small>Работает в обеих стойках. Это отдельный третий слот со своей Чёрной звездой и Вана.</small></div></div><div class="callout warn"><b>Не открывай сундук вслепую.</b>Нажми <span class="kbd">K</span>, посмотри активную вкладку навыков и реши, в какой стойке играешь. В сундуке выбирай именно этот тип оружия для своего класса.</div></section>
        <section class="guide-section"><h2 class="section-title">1. Рабочий старт — Тувалла</h2><ol class="instruction-list"><li>Купи подходящее оружие Туваллы у кузнеца/торговца, если его не выдала текущая линия развития.</li><li>Открой <span class="kbd">/</span> → <b>Улучшение</b>. Игра покажет требуемый Чёрный камень; на поздних ступенях используется магический вариант.</li><li>Сначала усиливай оружие своей стойки, затем дополнительное, потом второй боевой слот.</li><li>Не трать Кроны на дешёвые попытки Туваллы. При потере максимальной прочности открой кузнеца → <b>Ремонт → Восстановить макс. прочность</b>.</li></ol><div class="completion"><b>Можно идти дальше, когда:</b> оружие выбранной стойки и дополнительное оружие усилены до доступного максимума, персонаж закончил основную линию и достиг 61 уровня.</div></section>
        <section class="guide-section"><h2 class="section-title">2. Где взять Чёрную звезду V</h2><div class="gear-timeline"><div class="gear-stage"><span>А</span><div><b>Награда за 61 уровень</b><small>После выполнения условия истории открой <span class="kbd">Y</span> и забери сундук поддержки. Это самый простой первый слот.</small></div></div><div class="gear-stage"><span>Б</span><div><b>Академия Оливии</b><small>Даёт сундук Чёрной звезды IV и Камень Чёрной звезды для гарантированного V либо готовую награду по текущим условиям Академии.</small></div></div><div class="gear-stage"><span>В</span><div><b>Поддержка развития</b><small>Актуальный маршрут включает обмен/награду за Туваллу X на Чёрную звезду V. Проверяй окно прогресса сверху страницы.</small></div></div><div class="gear-stage"><span>Г</span><div><b>Рынок или ручное создание</b><small>Для создания начни с предмета «След разлома», поговори с Мартой Киен и пройди цепочку «[Оружие Чёрной звезды] След разлома». Для новичка готовая покупка обычно понятнее.</small></div></div></div><div class="figure-grid"><figure class="guide-figure"><img loading="lazy" src="https://sun9-78.userapi.com/s/v1/ig2/UrmyMVVanFm_NqFAnGwCbrPeZnu5vC2eTyi6D2SljhsoWv45gIorg9RLY0l8-mXM2DCT9cFE-RkVpP_hcofwJwNK.jpg?quality=95&amp;as=32x70,48x104,72x157,108x235,160x348,240x522,351x764&amp;from=bu&amp;cs=72x0" alt="Получение оружия Чёрной звезды в гайде Razorback"><figcaption>Ветка Чёрной звезды из Razorback JSON.</figcaption></figure></div><div class="callout"><b>Усиление IV → V.</b>Обычная попытка использует Чёрные камни, шанс усиления и может потребовать Кроны. Специальный Камень Чёрной звезды из Академии делает указанную попытку гарантированной — сначала внимательно прочитай описание предмета. Система Год-Айд удалена 26 марта 2026 года: старые советы про переход через неё больше не применяются.</div><div class="completion"><b>Этап завершён:</b> нужное оружие реально имеет уровень V, надето на персонажа и не лежит закрытым сундуком.</div></section>
        <section class="guide-section"><h2 class="section-title">3. Создание Оружия Вана</h2><p>Вана создаётся только из компонентов того же слота. Основное нельзя собрать из пробуждённой Чёрной звезды и наоборот.</p><table class="compact-table"><thead><tr><th>Слот</th><th>Допустимый рецепт</th><th>Понятный путь новичка</th></tr></thead><tbody><tr><td>Основное / пробуждённое</td><td>2 одинаковых Чёрных звезды V; или Чёрная звезда V + Пламя Начала; или Чёрная звезда V + босс V, Кафрас 20 + Камень сумерек</td><td>Чёрная звезда V + Пламя Начала</td></tr><tr><td>Дополнительное</td><td>2 дополнительных Чёрных звезды V + Камень сумерек; или Чёрная звезда V + Кутум V Кафрас 20 + Нубэр V Кафрас 20; или Чёрная звезда V + Камень сумерек + Камень начала</td><td>Сначала собери все компоненты и сверь актуальный рецепт в официальном окне создания</td></tr></tbody></table><ol class="instruction-list"><li>Сними с исходного предмета камни инкрустации и временные улучшения.</li><li>Проверь название слота каждого компонента.</li><li>Подойди к Статуе феникса в Улу-Ките и выбери нужный рецепт.</li><li>До подтверждения ещё раз сравни итоговый класс/тип оружия.</li></ol><div class="figure-grid"><figure class="guide-figure"><img loading="lazy" src="https://sun9-2.userapi.com/s/v1/ig2/z8nDspdu51ShhZXmaJSjVwM2yTSWM78Q-7mKS5bXS09AWqbDUXk4adgf9z58p5O1Q7ELoG5K-tLV1p26m9N1fIKu.jpg?quality=95&amp;as=32x72,48x109,72x163,108x244,160x362,240x543,351x794&amp;from=bu&amp;cs=72x0" alt="Оружие Вана в гайде Razorback"><figcaption>Оружие Вана и его место в маршруте. Из Razorback JSON.</figcaption></figure></div><div class="route-gate"><span><b>Не переходи к Вана, если:</b> у тебя только одна Чёрная звезда V и она сейчас держит весь урон; нет полного рецепта; ты не уверен в типе оружия.</span></div></section>
        <section class="guide-section"><h2 class="section-title">4. Усиление и камни закалки Вана</h2><ol class="instruction-list"><li>Открой <span class="kbd">/</span> → <b>Улучшение</b> и выбери Вана. Для этой линии нужен Чёрный камень начала; количество и шанс всегда смотри в окне.</li><li>На дорогих попытках сравни цену Кронов с ценой готового усиленного оружия.</li><li>Камни закалки добываются с мировых боссов Страны Утра или покупаются на аукционе.</li><li>ПКМ по камню регистрирует его. Управление: <b>ESC → Персонаж → Управление камнями закалки</b>.</li><li>Основное, пробуждённое и дополнительное оружие имеют отдельные наборы. Можно применить до пяти разных эффектов; зарегистрированный камень нельзя извлечь обратно.</li></ol><div class="figure-grid"><figure class="guide-figure"><img loading="lazy" src="https://sun9-60.userapi.com/s/v1/ig2/q9vkb8NaAVM-XZY_3GIqqcsEzDsIKnkR-D2u6ql8A1m_PqPkUl-kQrOqLsvJ5hlyMfFws9Xf77F1Bynd5kbDxTIY.jpg?quality=95&amp;as=32x7,48x11,72x17,108x25,160x37,240x56,360x84,480x112,540x126,622x145&amp;from=bu&amp;cs=72x0" alt="Камни закалки Оружия Вана"><figcaption>Схема камней закалки из Razorback JSON.</figcaption></figure></div><div class="completion"><b>Ветка оружия понятна полностью, если:</b> ты можешь назвать свой активный слот, источник каждой Чёрной звезды V, точный рецепт своего Вана и цену следующей попытки до нажатия кнопки.</div></section>`,sources:[['Razorback · Оружие','https://vk.com/@mavrein-gear-weapon'],['Актуальный маршрут развития · 19.06.2026',official.roadmap],['Академия Оливии',official.academy],['Официальный гайд по Оружию Вана',official.sov],['Удаление системы Год-Айд · 26.03.2026','https://www.ru.playblackdesert.com/News/Notice/Detail?boardNo=12213']]},
      {id:'armor',title:'Броня: от Туваллы до Идана',lead:'Каждую часть проводим через понятную цепочку: Тувалла → босс V → Кафрас 10 + своё пламя → Броня Усыпальницы времен → Рёв → Идан.',goal:'Собрать четыре правильные части без распыления Кафрасов и не обменять броню раньше необходимого уровня.',tasks:['Собрать четыре части Туваллы V/X','Получить бесплатную броню босса V из Магнуса и Академии','Выбрать следующий слот и довести его до Кафрас 10','Получить подходящее этому слоту пламя','Создать четыре части Брони Усыпальницы времен','Усилить нужную часть до Рёва только перед переходом в Идан'],body:`
        <div class="item-showcase"><div class="item-card"><img src="assets/items/caphras.webp" alt="Камень Кафраса"><div><b>Камень Кафраса</b><span class="item-id">ID 721003</span><a href="https://bdocodex.com/ru/item/721003/" target="_blank" rel="noopener">Название, вид и ID ↗</a></div></div></div>
        <section class="guide-section"><h2 class="section-title">1. Старт: Тувалла и бесплатная броня босса</h2><ol class="instruction-list"><li>Доведи четыре части Туваллы до V/X. Это рабочая броня, в которой выполняются сюжет и первые зоны охоты.</li><li>Пройди основную цепочку Магнуса и выбери один сундук брони босса V. Не бери случайный дубль уже закрытого слота.</li><li>Заверши условия Академии Оливии: среди наград есть ещё один сундук босса V.</li><li>Для простого PvE-маршрута с уроном снижения обычно выбирают: <b>Доспехи Красного носа, Шлем Грифона, Перчатки Бхега, Обувь Аргона</b>. Если класс строится на уклонении, не копируй набор вслепую — сверяй сборку класса.</li></ol><div class="figure-grid"><figure class="guide-figure"><img loading="lazy" src="https://sun9-24.userapi.com/s/v1/ig2/FH9mZQZtzWR6rnhclxSFS4n8aJJvqW27k48LXvVy_tXZWTuoYU5it2HjJQ1urKElOkRl4zG2Xfo4kdO1bDrJ4mp7.jpg?quality=95&amp;as=32x73,48x110,72x165,108x247,160x366,240x549,349x798&amp;from=bu&amp;cs=72x0" alt="Броня Туваллы в гайде Razorback"><figcaption>Стартовая броня Туваллы. Из Razorback JSON.</figcaption></figure><figure class="guide-figure"><img loading="lazy" src="https://sun9-7.userapi.com/s/v1/ig2/Bz4oNHIHxH0SXPgnh6VShROr2fC5PCn29XsZZQdARASkQsmkC-8DQZjyZOq2USbu_3pVVGjBjRT4zUGs8pNCi2n_.jpg?quality=95&amp;as=32x67,48x101,72x151,108x226,160x336,240x503,350x734&amp;from=bu&amp;cs=72x0" alt="Броня босса в гайде Razorback"><figcaption>Переход к боссу V. Из Razorback JSON.</figcaption></figure></div><div class="completion"><b>Этап завершён:</b> у тебя четыре надетые части, а бесплатные сундуки открыты в разные нужные слоты.</div></section>
        <section class="guide-section"><h2 class="section-title">2. Что означает «Кафрас 10»</h2><ol class="instruction-list"><li>Предмет обязан быть <b>босс V</b>. Кафрасы нельзя считать завершёнными, пока уровень вложения не равен 10.</li><li>ПКМ по Камню Кафраса или открой <span class="kbd">/</span> → <b>Поглощение энергии Кафраса</b>, выбери вещь и вкладывай камни.</li><li>Вкладывай в один выбранный слот до 10 уровня, а не понемногу во все четыре: только полностью готовая часть участвует в создании Брони Усыпальницы времен.</li><li>Для нагрудника выгоднее Красный нос V: до 10 уровня ему нужно <b>7224</b> Кафраса, тогда как Доспехам гигантского древня — <b>8260</b>.</li></ol><div class="callout warn"><b>Не путай уровень усиления и Кафрас.</b>«V» — уровень самой брони; «Кафрас 10» — отдельная шкала внутри уже усиленного предмета. Нужны оба условия одновременно.</div></section>
        <section class="guide-section"><h2 class="section-title">3. Четыре части Брони Усыпальницы времен — четыре разных рецепта</h2><table class="compact-table"><thead><tr><th>Итоговый слот</th><th>Основа</th><th>Второй компонент и куда идти</th></tr></thead><tbody><tr><td>Доспехи Мёртвого бога</td><td>Красный нос V или Древень V, Кафрас 10</td><td>Пламя отчаяния; его можно нагреть из 100 Искр отчаяния. Задание у Торина Моргрима.</td></tr><tr><td>Шлем Лабрескас</td><td>Грифон V или Гиас V, Кафрас 10</td><td>Пламя холода. Выполни цепочку Гор вечной зимы и следуй подсказке предмета.</td></tr><tr><td>Перчатки Тана</td><td>Бхег V или Либур V, Кафрас 10</td><td>Пламя Хонгик. Требуется соответствующая линия Страны Утра.</td></tr><tr><td>Обувь Атора</td><td>Аргон V или Маскан V, Кафрас 10</td><td>Пламя эха; нагревается из 100 Искр звонкого эха. Обмен у Тургефа.</td></tr></tbody></table><div class="callout"><b>Как получить пламя.</b>Либо выбей готовое/его искры в указанном регионе, либо купи на Центральном аукционе. Перед покупкой открой описание основы и убедись, что пламя относится именно к этому слоту.</div><div class="figure-grid"><figure class="guide-figure"><img loading="lazy" src="https://sun9-31.userapi.com/s/v1/ig2/6Tt35p7rJCTl6kIonS90zI9IQcImWAhwqI2NTFZZ3g0ukSOeoTuTgAWzpoXRQM3JPfEMD9MrcNTdqvUMsV-i-1k3.jpg?quality=95&amp;as=32x54,48x81,72x121,108x182,160x269,240x403,351x590&amp;from=bu&amp;cs=72x0" alt="Броня Усыпальницы в гайде Razorback"><figcaption>Комплект Брони Усыпальницы времен. Из Razorback JSON.</figcaption></figure><figure class="guide-figure"><img loading="lazy" src="https://sun9-47.userapi.com/s/v1/ig2/VwzAc5Emx0DqF1YA_FY0yiha8yHDjhQdeFVtLihRH7le__6426HXbauIClWsTUW_94hMpK7usx2YHI8bV-0wPXlN.jpg?quality=95&amp;as=32x37,48x56,72x83,108x125,160x185,240x278,334x387&amp;from=bu&amp;cs=72x0" alt="Обувь Атора в гайде Razorback"><figcaption>Отдельный путь Обуви Атора. Из Razorback JSON.</figcaption></figure></div><div class="completion"><b>Этап завершён:</b> в каждом из четырёх слотов надета соответствующая часть Брони Усыпальницы времен; старая основа и пламя были использованы только в правильном рецепте.</div></section>
        <section class="guide-section"><h2 class="section-title">4. Как усиливать Броню Усыпальницы времен</h2><p>Названия ступеней идут так: <b>базовая → Жажда → Искажение → Молчание → Рёв → Трепет</b>. Это те же уровни усиления, но с собственными названиями.</p><div class="how-grid"><div class="how-card"><b>Рабочая цель</b><small>Сначала одинаково разумные ступени на четырёх частях; поддержка может дать одну часть «Молчание».</small></div><div class="how-card"><b>Перед попыткой</b><small>Проверь шанс, расход Камней Крон и последствия неудачи. Не используй случайный высокий шанс.</small></div><div class="how-card"><b>Перед Иданом</b><small>Конкретная часть должна быть усилена до «Рёв». «Молчание» для обмена недостаточно.</small></div></div><div class="route-gate"><span><b>Стоп:</b> не гони одну вещь к Рёву, если остальные слоты резко слабее и ты ещё не выполнил условия Идана.</span></div></section>
        <section class="guide-section"><h2 class="section-title">5. Переход к броне Идана</h2><ol class="instruction-list"><li>Заверши требуемую историю Идании и цепочку <b>«[Броня Идана] Тайна»</b>.</li><li>Подготовь часть Брони Усыпальницы времен уровня <b>Рёв</b> и <b>Фрагмент Идана</b> для того же слота.</li><li>После открытия системы подойди к Осколку Идана. Создание каждой части ограничено еженедельным заданием.</li><li>До подтверждения проверь слот, усиление «Рёв» и наличие фрагмента: обмен необратимо переводит предмет в следующую линию.</li><li>Альтернативный поздний путь: часть уровня <b>Трепет</b> обменивается на Броню Идана IX того же типа.</li></ol><div class="figure-grid"><figure class="guide-figure"><img loading="lazy" src="https://sun9-4.userapi.com/s/v1/ig2/SPJJuc-gnDEE2bswoL3OExT2EVS_JkzWDQPPXnfB4JoFF0ls7hvXEW9yYPjAborIn-hXWQVXxsfV0yI7LMjQqnW_.jpg?quality=95&amp;as=32x57,48x86,72x128,108x192,160x285,240x428,349x622&amp;from=bu&amp;cs=72x0" alt="Броня Идана в гайде Razorback"><figcaption>Следующая линия после Брони Усыпальницы времен «Рёв». Из Razorback JSON.</figcaption></figure></div><div class="completion"><b>Ветка брони понятна полностью, если:</b> для каждого слота ты можешь назвать основу босса, его пламя, нужный уровень Кафраса и условие перехода к Идану.</div></section>`,sources:[['Razorback · Броня','https://vk.com/@mavrein-gear-armor'],['Актуальный маршрут развития · 19.06.2026',official.roadmap],['Доспехи Мёртвого бога · официальная база','https://www.ru.playblackdesert.com/Wiki/Default?wikiNo=278'],['Обувь Атора · официальный патчноут',official.ator],['Броня Идана · официальный патчноут','https://www.ru.playblackdesert.com/News/Notice/Detail?CountryType=ru-RU&boardNo=11225']]},
      {id:'accessories',title:'Аксессуары: от Туваллы до Харзата',lead:'Стартовый круг не ломаем ради случайной попытки: Тувалла → Иллирия → бесплатный Харзат IV → постепенный комплект Харзата VII–IX.',goal:'Понимать источник каждого следующего аксессуара, отдельные правила Харзата и безопасно заменять по одному слоту.',tasks:['Собрать полный рабочий круг Туваллы','Забрать и усилить доступные аксессуары Иллирии','Получить Харзат IV по поддержке развития','Выбрать следующий слабый слот','Создать или обменять нужный Харзат','Усилять запасной предмет, не снимая рабочий комплект'],body:`
        <div class="item-showcase"><div class="item-card"><img src="assets/items/deboreka.webp" alt="Ожерелье Деборики"><div><b>Ожерелье Деборики</b><span class="item-id">ID 11653</span><a href="https://bdocodex.com/ru/item/11653/" target="_blank" rel="noopener">Название, вид и ID ↗</a></div></div><div class="item-card"><img src="assets/items/kharazad.webp" alt="Ожерелье Харзата"><div><b>Ожерелье Харзата</b><span class="item-id">ID 11697</span><a href="https://bdocodex.com/ru/item/11697/" target="_blank" rel="noopener">Название, вид и ID ↗</a></div></div></div>
        <section class="guide-section"><h2 class="section-title">1. Безопасный стартовый круг</h2><div class="gear-timeline"><div class="gear-stage"><span>1</span><div><b>Тувалла</b><small>Два кольца, две серьги, ожерелье и пояс. Сначала закрывает все шесть слотов.</small></div></div><div class="gear-stage"><span>2</span><div><b>Иллирия V</b><small>Получается через текущие награды развития и усиливается специальными материалами этой линии. Меняй только если итоговые характеристики выше.</small></div></div><div class="gear-stage"><span>3</span><div><b>Харзат IV</b><small>Актуальная поддержка даёт первый предмет за развитие Туваллы X. Выбирай самый слабый или самый дорогой для будущей замены слот.</small></div></div></div><div class="figure-grid"><figure class="guide-figure"><img loading="lazy" src="https://sun9-79.userapi.com/s/v1/ig2/qUv44UGvMumpEJoA9Zbfh11IkfPg7eurwt74GyswtPx8s9TO4ge7KHeMsBh1uRoN9pKulzPpNVnj-Wbj32ncKaC8.jpg?quality=95&amp;as=32x66,48x100,72x149,108x224,160x332,240x498,350x726&amp;from=bu&amp;cs=72x0" alt="Аксессуары Иллирии в гайде Razorback"><figcaption>Промежуточная линия Иллирии. Из Razorback JSON.</figcaption></figure></div><div class="callout good"><b>Правило замены.</b>Новый предмет сначала усиливается и сравнивается в инвентаре. Старый снимается только когда новый уже даёт не меньше нужной атаки/меткости. Так не возникает «провала» экипировки.</div></section>
        <section class="guide-section"><h2 class="section-title">2. Три способа получить Харзат</h2><div class="how-grid"><div class="how-card"><b>Поддержка</b><small>Первый Харзат IV — награда актуального пути развития. Это приоритет новичка.</small></div><div class="how-card"><b>Создание</b><small>Для предмета того же типа: 50 Эссенций рассвета + 300 Фрагментов силы + базовый аксессуар Деборики.</small></div><div class="how-card"><b>Обмен Деборики</b><small>Деборика IV → Харзат V; Деборика V → Харзат IX у Айн Грейд после обязательного задания.</small></div></div><div class="figure-grid"><figure class="guide-figure"><img loading="lazy" src="https://sun9-5.userapi.com/s/v1/ig2/3aLFlAzu4yx1D1y9HB5Yk2UBi6lEiCNck0RvG71sdh0PcMUcTktbfwIB10bx-Sj_31IxGV5pELMtEGjYP7g2_Baq.jpg?quality=95&amp;as=32x51,48x76,72x115,108x172,160x255,240x382,351x559&amp;from=bu&amp;cs=72x0" alt="Аксессуары Деборики в гайде Razorback"><figcaption>Деборика — компонент создания или обмена. Из Razorback JSON.</figcaption></figure><figure class="guide-figure"><img loading="lazy" src="https://sun9-49.userapi.com/s/v1/ig2/vDsEx8fJROWgZJ9g4Hm6ehC3YgwZa7NG2GdXZESlg8KWJKUWzvAoLoPS7FzeDTpftPJvR5Ih_t0LjFeNs1SOcGsL.jpg?quality=95&amp;as=32x69,48x103,72x154,108x231,160x343,240x514,351x752&amp;from=bu&amp;cs=72x0" alt="Аксессуары Харзата в гайде Razorback"><figcaption>Долгосрочная линия Харзата. Из Razorback JSON.</figcaption></figure></div><div class="callout warn"><b>Тип обязан совпасть.</b>Из ожерелья Деборики создаётся/обменивается ожерелье Харзата; из пояса — пояс и так далее. Не покупай Деборику, пока не выбран конкретный пустой слот.</div></section>
        <section class="guide-section"><h2 class="section-title">3. Почему Харзат усиливается иначе</h2><div class="compare"><div><h3>Обычный аксессуар</h3><p>Требует вторую такую же вещь. При неудаче без Кронов обе обычно уничтожаются.</p></div><div><h3>Харзат</h3><p>Не требует копии и не уничтожается. Неудача снимает 20 максимальной прочности и может понизить ступень; Кроны защищают согласно предупреждению окна.</p></div></div><ol class="instruction-list"><li>Для ступеней 0–IX используется <b>Эссенция рассвета</b>; для IX → X — <b>Чёрный камень рассвета</b>.</li><li>Открой <span class="kbd">/</span> → Улучшение, положи Харзат и сначала прочитай строку о понижении.</li><li>Выбери подходящий Совет Валкса/шанс из Нити Надера.</li><li>После неудач восстанови максимальную прочность <b>Обрывками воспоминаний</b> у кузнеца.</li><li>Не нажимай попытку на единственном надетом предмете, если понижение сломает порог зоны охоты.</li></ol></section>
        <section class="guide-section"><h2 class="section-title">4. Ориентиры усиления Харзата</h2><table class="compact-table"><thead><tr><th>Попытка</th><th>Материал</th><th>Ориентир шанса</th></tr></thead><tbody><tr><td>0 → I</td><td>1 Эссенция рассвета</td><td>40</td></tr><tr><td>I → II</td><td>2</td><td>60</td></tr><tr><td>II → III</td><td>3</td><td>90</td></tr><tr><td>III → IV</td><td>4</td><td>130</td></tr><tr><td>IV → V</td><td>6</td><td>170</td></tr><tr><td>V → VI</td><td>8</td><td>200</td></tr><tr><td>VI → VII</td><td>10</td><td>230</td></tr><tr><td>VII → VIII</td><td>12</td><td>260</td></tr><tr><td>VIII → IX</td><td>15</td><td>280</td></tr><tr><td>IX → X</td><td>Чёрный камень рассвета</td><td>300</td></tr></tbody></table><p class="razor-note">Это официальные ориентиры, а не обязательная команда. Перед каждой попыткой сравни текущую цену материала, Кронов и готового предмета.</p><div class="figure-grid"><figure class="guide-figure"><img loading="lazy" src="https://sun9-65.userapi.com/s/v1/ig2/SY6HZMIVrslD40_Kw66cI8tXjjTsGn3p9X5xMQbhXvQV3Cna3RHqNdHUz5Kir7988gP-Dk37SQUdU5E5y3qu7mdD.jpg?quality=95&amp;as=32x33,48x49,72x74,108x111,160x165,240x247,360x371,480x494,540x556,640x659,720x742,729x751&amp;from=bu&amp;cs=72x0" alt="Маршрут аксессуаров в гайде Razorback"><figcaption>Общая последовательность аксессуаров. Из Razorback JSON.</figcaption></figure></div></section>
        <section class="guide-section"><h2 class="section-title">5. Порядок замены шести слотов</h2><ol class="instruction-list"><li>Открой инвентарь и выпиши характеристики всех шести надетых аксессуаров.</li><li>Выбери один предмет с наименьшим полезным приростом/самой дешёвой заменой.</li><li>Получай и усиливай Харзат для этого слота отдельно.</li><li>Надень его только после готовности, затем повтори расчёт: следующий слабый слот мог измениться.</li><li>Ориентир маршрута поддержки: полный Харзат VII, затем IX — не пытайся сразу сделать X на одном слоте.</li></ol><div class="completion"><b>Ветка аксессуаров понятна полностью, если:</b> все шесть слотов заполнены, рабочий комплект не участвует в рискованных попытках, а для следующего Харзата заранее известны тип, способ получения, материал и шанс.</div></section>`,sources:[['Razorback · Аксессуары','https://vk.com/@mavrein-gear-accessories'],['Актуальный маршрут развития · 19.06.2026',official.roadmap],['Официальное руководство Харзата',official.kharazad]]},
      {id:'gear-money',title:'Покупать или усиливать',lead:'Самостоятельная заточка не означает экономию. Ты покупаешь шанс и принимаешь разброс результата.',goal:'Выбирать способ получения по бюджету и терпимости к риску.',tasks:['Посчитать материалы, Кроны и восстановление','Проверить цену готового предмета','Не использовать надетый единственный предмет для риска','Оставлять серебро на расходники и следующий шаг'],body:`
        <div class="compare"><div><h3>Покупка</h3><p>Предсказуемая цена и мгновенный результат. Лучший выбор, если не любишь риск или предмет нужен прямо сейчас.</p></div><div><h3>Усиление</h3><p>Может выйти дешевле или намного дороже. Делай ради процесса либо при понятной математике и запасе ресурсов.</p></div></div><section class="guide-section"><h2 class="section-title">Что входит в цену попытки</h2><table class="compact-table"><thead><tr><th>Расход</th><th>Что проверить</th></tr></thead><tbody><tr><td>Основной материал</td><td>Количество камней, эссенций или копий на одну попытку.</td></tr><tr><td>Шанс усиления</td><td>Стоимость Совета Валкса и ценность уже накопленного шанса.</td></tr><tr><td>Камни Крон</td><td>Количество на попытку и от какого именно последствия они защищают.</td></tr><tr><td>Максимальная прочность</td><td>Обрывки воспоминаний или копии предмета после неудачи.</td></tr><tr><td>Понижение/уничтожение</td><td>Цена возврата на прежнюю ступень либо полной замены аксессуара.</td></tr><tr><td>Налог и доступность</td><td>Чистая цена покупки/продажи и реальное число сделок на аукционе.</td></tr></tbody></table></section><section class="guide-section"><h2 class="section-title">Решение за пять минут</h2><ol class="instruction-list"><li>Запиши цену готовой нужной ступени и цену текущей ступени.</li><li>Посчитай стоимость одной попытки со всем ремонтом и страховкой.</li><li>Умножь не на «среднее число успехов», а заложи запас на плохую серию.</li><li>Если провал лишает тебя рабочего комплекта — усиливай запасной предмет или покупай готовый.</li><li>После покупки оставь резерв на еду, кристаллы, ремонт и следующий проект.</li></ol><div class="callout good"><b>Простое правило новичка.</b>Готовый предмет обычно безопаснее; самостоятельное усиление оправдано, когда материалы уже накоплены, риск понятен и процесс тебе нравится.</div></section>`}
    ]},
    {id:'family',icon:'06',title:'Сила семьи',sub:'аккаунт, экономика, гильдия',topics:[
      {id:'family-power',title:'Энергия и влияние',lead:'Максимум энергии растёт от завершённых категорий знаний; влияние — от опыта влияния за задания и обмены.',goal:'Уметь самостоятельно выбрать следующую категорию знаний и следующий источник опыта влияния.',tasks:['Открыть H и найти незавершённую категорию с наградой энергии','Закрыть одну простую категорию жителей или торговцев','Проверить новый максимум энергии','Продолжать основную сюжетную цепочку ради опыта влияния','Вернуть влияние из ненужного узла или аренды','Оставить свободный резерв для жилья, склада и огорода'],body:`
        <section class="guide-section"><h2 class="section-title">Сначала не путай два ресурса</h2><div class="compare"><div><h3>Энергия</h3><p><b>Максимальный запас</b> общий для семьи и увеличивается знаниями. <b>Текущий запас</b> расходуется и восстанавливается отдельно у каждого персонажа.</p></div><div><h3>Влияние</h3><p>Общий для всей семьи пул. Он не исчезает: очки возвращаются после отключения узла, продажи дома или возврата арендованного предмета.</p></div></div></section>
        <section class="guide-section"><h2 class="section-title">Как повышать максимальную энергию</h2><ol class="instruction-list"><li>Нажми <span class="kbd">H</span> и открой дерево знаний. Число рядом с категорией показывает, сколько знаний уже найдено; значок энергии — награду за порог или завершение.</li><li>Для начала выбери <b>Люди → Жители Велии / Торговцы Велии</b>: незнакомые НИП отмечены вопросительным знаком. Подойди и поговори клавишей <span class="kbd">R</span>.</li><li>Затем закрывай <b>Топографию</b>: открывай новые узлы и области на карте, разговаривай с управляющими узлов.</li><li>В <b>Экологии</b> знания появляются при убийстве соответствующих монстров. Наведи на пустую строку категории — подсказка сузит место поиска.</li><li>Категории <b>Приключения, Академические знания, Ремёсла</b> закрываются сюжетами, осмотром объектов, рецептами, рыбалкой и другими действиями. Сначала выбирай простые категории.</li><li>После закрытия порога снова открой <span class="kbd">H</span> и проверь максимум. Прибавка применяется ко всем персонажам семьи.</li></ol><div class="completion"><b>Проверка:</b> до начала запомни максимум, закрой одну категорию и убедись, что число энергии выросло. Если не выросло — категория не давала энергию или не достигнут нужный порог.</div></section>
        <section class="guide-section"><h2 class="section-title">Как повышать влияние</h2><ol class="instruction-list"><li>Открой <span class="kbd">O</span> и продолжай <b>основную историю</b>. С сентября 2025 года награды опытом влияния в основной цепочке увеличены — это лучший естественный путь новичка.</li><li>В награде задания ищи значок <b>«Опыт влияния»</b>. Это не готовое очко: опыт заполняет шкалу, после чего максимум влияния увеличивается на 1.</li><li>После сюжета выполняй удобные побочные, повторяемые и еженедельные задания с опытом влияния.</li><li>Некоторые предметы можно обменивать у НИП на опыт влияния; сначала проверь описание, чтобы не отдать нужный материал.</li><li>Текущий показатель и прогресс смотри в окне персонажа <span class="kbd">P</span>. Чем выше влияние, тем больше опыта обычно нужно для следующего очка.</li></ol><div class="callout good"><b>Практичный порядок:</b> сюжет Баленоса → Серендии → Кальфеона → Медии; затем задания нужного города и еженедельные задания тех зон, где ты всё равно охотишься.</div></section>
        <section class="guide-section"><h2 class="section-title">Куда тратить и как вернуть</h2><div class="how-grid"><div class="how-card"><b>Узлы</b><small>На карте <span class="kbd">M</span> выбери активированный узел и верни вложенное влияние, если цепочка больше не нужна.</small></div><div class="how-card"><b>Жильё и склад</b><small>В городе открой дом и нажми продажу — занятые очки вернутся после завершения связанных производств.</small></div><div class="how-card"><b>Аренда и огород</b><small>Верни предмет тому НИП, у которого арендовал. Забор также нужно сдать, а не просто удалить.</small></div></div><div class="route-gate"><span><b>Резерв новичка:</b> не распределяй влияние до нуля. Оставь свободные очки на склад, жильё, рабочего или огород.</span></div></section>`,sources:[['Razorback · Основные квесты','https://vk.com/@mavrein-main-quests'],['Официально · Знания и энергия','https://www.ru.playblackdesert.com/Wiki/Default?wikiNo=27'],['Официально · Очки влияния','https://www.ru.playblackdesert.com/Wiki/Default?wikiNo=23'],['Изменение опыта влияния · 18.09.2025','https://www.ru.playblackdesert.com/News/Notice/Detail?CountryType=ru-RU&boardNo=11359']]},
      {id:'journals',title:'Дневники приключений',lead:'Дневники дают постоянные характеристики всей семье. Выбирай книгу по награде, а не по положению на полке.',goal:'Закрыть полезные постоянные награды и видеть, какие книги уже завершены.',customTasks:true,tasks:['Игорь Бартелли','Неизвестный странник','Лулу','Путь к успеху Фугара','Глашатай Рубин','Энциклопедия Деве'],body:`
        <section class="guide-section"><h2 class="section-title">Где открыть и с чего начать</h2><ol class="instruction-list"><li>Нажми <span class="kbd">Esc</span> и в поиске меню напиши <b>«Дневники приключений»</b>. Открой полку и проверь условия разблокировки нужной книги.</li><li>Сначала проходи главы, для которых предметы уже есть. Не покупай дорогую вещь только ради маленькой промежуточной награды.</li><li>После каждой главы <b>нажми на награду в книге</b>: выполненное условие само по себе не всегда применяет характеристику.</li><li>Проверь результат в <span class="kbd">P</span>. Атака, защита, здоровье, грузоподъёмность и слоты применяются ко всей семье, если в награде так и указано.</li></ol></section>
        <section class="guide-section"><h2 class="section-title">Основные дневники и постоянные награды</h2><div class="diary-grid">
          <article class="diary-card"><div class="diary-head"><div class="diary-icon">I</div><div><h3>Игорь Бартелли</h3><small>главная линия характеристик</small></div></div><div class="stat-tags"><span class="stat-tag">Атака +6</span><span class="stat-tag">Защита +6</span><span class="stat-tag">HP +877</span><span class="stat-tag">Выносливость +438</span><span class="stat-tag">Меткость +29</span><span class="stat-tag">Уклонение +8</span><span class="stat-tag">Вес +28 LT</span><span class="stat-tag">Инвентарь +4</span></div><p>Приоритет №1. После объединения постоянных боевых наград в 2025 году именно эта линия стала основным источником семейных статов.</p><a href="https://orbit-games.com/black-desert/diaries/black-desert-dnevnik-priklyuchenij-igorya-bartelli/" target="_blank" rel="noopener">Прохождение на «Орбите игр» ↗</a><label class="diary-toggle"><input type="checkbox" data-check="journals:0"><span>Отметить дневник выполненным</span></label></article>
          <article class="diary-card"><div class="diary-head"><div class="diary-icon">X</div><div><h3>Неизвестный странник</h3><small>короткая постоянная прибавка</small></div></div><div class="stat-tags"><span class="stat-tag">Атака +1</span><span class="stat-tag">Защита +1</span><span class="stat-tag">HP +103</span></div><p>Хорошая цель после открытия регионов: небольшая книга даёт редкие постоянные боевые характеристики.</p><a href="https://orbit-games.com/black-desert/diaries/dnevnik-priklyuchenij-neizvestnogo-strannika/" target="_blank" rel="noopener">Прохождение на «Орбите игр» ↗</a><label class="diary-toggle"><input type="checkbox" data-check="journals:1"><span>Отметить дневник выполненным</span></label></article>
          <article class="diary-card"><div class="diary-head"><div class="diary-icon">L</div><div><h3>Путешествия Лулу</h3><small>награда за количество заданий</small></div></div><div class="stat-tags"><span class="stat-tag">Вес +6 LT</span><span class="stat-tag">Инвентарь +1</span><span class="stat-tag">Шанс усиления +5</span></div><p>Прогресс идёт от обычных выполненных заданий. Повторяемые и ежедневные задания в счётчик не входят.</p><a href="https://orbit-games.com/black-desert/diaries/black-desert-dnevnik-puteshestvij-lulu/" target="_blank" rel="noopener">Прохождение на «Орбите игр» ↗</a><label class="diary-toggle"><input type="checkbox" data-check="journals:2"><span>Отметить дневник выполненным</span></label></article>
          <article class="diary-card"><div class="diary-head"><div class="diary-icon">F</div><div><h3>Путь к успеху Фугара</h3><small>влияние и удобство</small></div></div><div class="stat-tags"><span class="stat-tag">Вес +2 LT</span><span class="stat-tag">Инвентарь +1</span><span class="stat-tag">Опыт влияния</span></div><p>Полезная ранняя серия после Медии: помогает накопить влияние и даёт семейные удобства без дорогой экипировки.</p><a href="https://orbit-games.com/black-desert/gajdy-black-desert/diaries/black-desert-era-uspexa-fugara-1/" target="_blank" rel="noopener">Первый том на «Орбите игр» ↗</a><label class="diary-toggle"><input type="checkbox" data-check="journals:3"><span>Отметить серию выполненной</span></label></article>
          <article class="diary-card"><div class="diary-head"><div class="diary-icon">R</div><div><h3>Глашатай Рубин</h3><small>испытания на время</small></div></div><div class="stat-tags"><span class="stat-tag">Вес +2 LT</span><span class="stat-tag">Крики Валкса: лимит +3</span><span class="stat-tag">Советы и титулы</span></div><p>Не начинай без быстрого транспорта и подготовки маршрута: многие главы запускают таймер отдельным диалогом.</p><a href="https://orbit-games.com/black-desert/diaries/black-desert-dnevnik-priklyuchenij-glashataya-rubina-1/" target="_blank" rel="noopener">Первый том на «Орбите игр» ↗</a><label class="diary-toggle"><input type="checkbox" data-check="journals:4"><span>Отметить серию выполненной</span></label></article>
          <article class="diary-card"><div class="diary-head"><div class="diary-icon">D</div><div><h3>Энциклопедия Деве</h3><small>коллекции предметов</small></div></div><div class="stat-tags"><span class="stat-tag">Вес +2 LT</span><span class="stat-tag">Питомец</span><span class="stat-tag">Мебель и внешний вид</span></div><p>Сначала прочитай всю главу и составь список предметов. Не удаляй и не покупай коллекционные вещи по одной вслепую.</p><a href="https://orbit-games.com/black-desert/diaries/black-desert-dnevniki-priklyuchenij/" target="_blank" rel="noopener">Каталог дневников «Орбиты игр» ↗</a><label class="diary-toggle"><input type="checkbox" data-check="journals:5"><span>Отметить серию выполненной</span></label></article>
        </div></section>
        <div class="callout warn"><b>Цифры относятся к постоянным семейным наградам.</b>Одноразовые камни, советы, мебель и прочие предметы показаны не полностью. Обновления могут переносить характеристики между книгами — перед дорогой главой сверь условие в игре и по ссылке.</div>`,sources:[['Орбита игр · каталог дневников','https://orbit-games.com/black-desert/diaries/black-desert-dnevniki-priklyuchenij/'],['Официально · объединение постоянных наград 24.07.2025','https://www.ru.playblackdesert.com/News/Notice/Detail?boardNo=11137&countryType=ru-RU']]},
      {id:'market',title:'Склад и аукцион',lead:'Серебро семьи хранится централизованно, предметы — на складах регионов и складе аукциона.',goal:'Не терять предметы и не переплачивать из-за спешки.',tasks:['Разобраться со складом города и складом аукциона','После Магнуса использовать связанные склады','Перед продажей дорогого предмета проверить комиссию','Использовать предзаказ вместо постоянного обновления'],body:`
        <div class="compare"><div><h3>Инвентарь персонажа</h3><p>То, что несёт конкретный герой. Вес и слоты ограничивают фарм и перемещение.</p></div><div><h3>Склад города</h3><p>Материалы и предметы региона. После Магнуса открытые склады доступны через одного кладовщика и горничных.</p></div><div><h3>Склад аукциона</h3><p>Отдельное хранилище только для вещей, которые допускаются к продаже/покупке на Центральном аукционе.</p></div><div><h3>Инвентарь аккаунта</h3><p>Специальные общие предметы для всех персонажей. Открывается отдельной рекомендуемой цепочкой.</p></div></div><section class="guide-section"><h2 class="section-title">Покупка без переплаты</h2><ol class="instruction-list"><li>Найди предмет по точному названию и выбери правильную ступень усиления.</li><li>Открой график цен и историю сделок. Максимальная цена не означает, что предмет действительно регулярно продаётся.</li><li>Если товара нет, поставь предзаказ и оставь серебро на складе аукциона. Не обновляй окно вручную.</li><li>После покупки открой «Склад аукциона» и забери предмет в инвентарь либо через кладовщика.</li></ol></section><section class="guide-section"><h2 class="section-title">Продажа без ошибки</h2><ol class="instruction-list"><li>Сними кристаллы, камни и улучшения, которые игра не переносит вместе с предметом.</li><li>Сравни чистую сумму после комиссии с ценностью предмета для твоего следующего шага.</li><li>Премиум-набор влияет на получение серебра от продажи; проверь активный эффект <b>до нажатия «Получить»</b>.</li><li>Редкие материалы и части сокровищ сначала идентифицируй — отсутствие знакомого названия не означает мусор.</li></ol><div class="callout warn"><b>Склад — часть маршрута.</b>Держи расходники рядом с персонажем, материалы проекта в одном городе, товары бартера на Илии, а продаваемые предметы — на складе аукциона.</div></section>`},
