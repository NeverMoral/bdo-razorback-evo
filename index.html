      {id:'guild',title:'Гильдия',lead:'Гильдия — это пассивные навыки, зарплата, задания, боссы и люди, у которых можно быстро спросить непонятное.',goal:'Вступить в подходящую гильдию и самостоятельно попасть на её боссов.',tasks:['Проверить правила, связь и расписание','Открыть G и посмотреть активные навыки','Забрать ежедневную зарплату по контракту','Выполнить подходящее гильдийное задание','Уточнить срок статуса ученика','Пройти полный сбор на гильдийных боссов'],body:`
        <section class="guide-section"><h2 class="section-title">Что гильдия даёт новичку</h2><div class="how-grid"><div class="how-card"><b>Пассивные навыки</b><small>Бонусы к бою, ремёслам и удобству действуют, пока персонаж состоит в гильдии и навык изучен. Проверяй <span class="kbd">G</span> → «Навыки гильдии».</small></div><div class="how-card"><b>Контракт и зарплата</b><small>Размер выплаты зависит от контракта и правил конкретной гильдии. Забирается в окне <span class="kbd">G</span>; это не гарантированный крупный доход.</small></div><div class="how-card"><b>Задания</b><small>Боевые, ремесленные и морские задания развивают гильдию. Участник получает личное вознаграждение по правилам задания.</small></div><div class="how-card"><b>Групповой контент</b><small>Гильдийные боссы, море, осады и другие совместные активности. Выбирай гильдию с расписанием, которое тебе реально подходит.</small></div><div class="how-card"><b>Помощь</b><small>Сборки класса, механики, телепорты и поиск группы. Нормальная гильдия объясняет правила до наказаний.</small></div><div class="how-card"><b>Срок ученика</b><small>После вступления действует ограниченный статус. В Razorback-гайде указан срок в 7 дней и запрет на боссов; фактические ограничения проверь в своей гильдии.</small></div></div><div class="figure-grid"><figure class="guide-figure"><img loading="lazy" src="https://sun9-82.userapi.com/s/v1/ig2/53pLD3a-EhtFf3vjKF1REfgH_GrXy6KySCDh4w_2HblgtORwNVEzmlzxfbS_4I39II-LT9KFuB-3LAWfXYA0uXSp.jpg?quality=95&amp;as=32x24,48x36,72x53,108x80,160x119,240x178,360x267,480x356,540x400,640x474,720x534,1080x800,1097x813&amp;from=bu&amp;cs=72x0" alt="Окно навыков гильдии в Black Desert"><figcaption>Окно навыков: смотри фактически изученные бонусы, а не только обещания в объявлении. Из Razorback JSON.</figcaption></figure></div></section>
        <section class="guide-section"><h2 class="section-title">Как попасть на гильдийных боссов</h2><div class="mini-route"><span>1. Узнать день и время</span><i>→</i><span>2. Сменить канал</span><i>→</i><span>3. Отметиться в чате</span><i>→</i><span>4. Вступить в рейд</span><i>→</i><span>5. G → Охота на босса</span><i>→</i><span>6. Прийти по стрелке</span><i>→</i><span>7. Ударить босса и забрать добычу</span></div><ol class="instruction-list"><li>Заранее спроси в гильдийном чате: <b>день, время, канал, нужен ли голосовой чат и допускаются ли ученики</b>. Расписание Razorback — лишь пример, не общее правило.</li><li>За 10–15 минут до старта перейди на указанный канал и освободи инвентарь. Возьми лечение; персонажу нужен хотя бы один нанесённый удар для участия в добыче.</li><li>Поставь «+» в гильдийный чат или выполни другой принятый в гильдии знак. Прими приглашение в рейд.</li><li>Открой <span class="kbd">G</span> → <b>Охота на босса</b>. Используй навигацию окна или команду ведущего и не призывай ничего самостоятельно.</li><li>Следуй отметкам лидера. После убийства подбери добычу и дождись команды на следующего босса — группа может перемещаться цепочкой.</li></ol><div class="figure-grid"><figure class="guide-figure"><img loading="lazy" src="https://sun9-27.userapi.com/s/v1/ig2/rImQrZrqqN-sVRPq703XPnLHbaFZUWz6BuWkp7CgWoGVSeHupXTasdqYu48iktQciw14vD8njhg4S_BHEq0KcgSj.jpg?quality=95&amp;as=32x24,48x35,72x53,108x80,160x118,240x177,360x265,480x354,540x398,640x471,720x530,1080x795,1093x805&amp;from=bu&amp;cs=72x0" alt="Окно охоты на гильдийного босса"><figcaption>Через это окно гильдия управляет охотой и навигацией. Из Razorback JSON.</figcaption></figure><figure class="guide-figure"><img loading="lazy" src="https://sun9-25.userapi.com/s/v1/ig2/VPaucfiqych4brk70zNSSRpxSuZmiBqUPUn9cJlzOaprmq3VH27u-O0QJnBzL5_dzM9nKX78yQXGj5JzwcYt7kzz.jpg?quality=95&amp;as=32x8,48x12,72x18,108x27,160x40,240x60,360x91,480x121,540x136,640x161,652x164&amp;from=bu&amp;cs=72x0" alt="Флаг призыва гильдийного босса"><figcaption>Пример точки призыва. Не взаимодействуй с объектами без команды ведущего. Из Razorback JSON.</figcaption></figure></div></section>
        <section class="guide-section"><h2 class="section-title">Минимум механик боссов</h2><div class="activity-grid"><div class="activity-card"><div class="activity-head"><div class="activity-icon">K</div><div><h3>Хан</h3><small>Око Окиллу</small></div></div><p>Стрельба из пушек: обычная серия — ЛКМ, ЛКМ, ЛКМ, затем усиленный выстрел ПКМ. На опасной атаке прячь пушку за скалой и слушай ведущего; добыча появляется в центре.</p></div><div class="activity-card"><div class="activity-head"><div class="activity-icon">O</div><div><h3>Орк</h3><small>три безопасные зоны</small></div></div><p>Гильдийный навык может призвать участников на босса. Во время механики заходи в один из трёх жёлтых кругов, чтобы избежать урона.</p></div><div class="activity-card"><div class="activity-head"><div class="activity-icon">M</div><div><h3>Могул</h3><small>фазы около 60% и 30%</small></div></div><p>На фазе из четырёх мини-боссов найди и убей именно цель с красной дымкой. Тогда босс потеряет защиту и не восстановит здоровье.</p></div><div class="activity-card"><div class="activity-head"><div class="activity-icon">Г</div><div><h3>Грязь и Лава</h3><small>простые боссы</small></div></div><p>На Грязи выходи из красных массовых атак. На Лаве держись с группой: маленькие призванные монстры обычно погибают от общего урона.</p></div></div><div class="callout warn"><b>Доход не фиксирован.</b>В Razorback приведён пример недельной суммы для их состава боссов, но фактическое серебро зависит от набора боссов, участия, выпадений и цен аукциона. Считай добычу после продажи, а не по чужому обещанию.</div></section>`,sources:[['Razorback · Гильдия','https://vk.com/@mavrein-guild'],['Razorback · Гильдийные боссы','https://vk.com/@mavrein-guild-bosses']]}
    ]},
    {id:'life',icon:'07',title:'Ремёсла и мир',sub:'кони, океан, сокровища',topics:[
      {id:'lifeskills',title:'Как выбрать ремесло',lead:'Не прокачивай всё одновременно. Попробуй системы и выбери одну, которую приятно повторять.',goal:'Получить дополнительный игровой цикл без превращения игры во вторую работу.',tasks:['Пройти ремесленные уроки Академии/обучающие задания, если доступны','Попробовать сбор, кулинарию, рыбалку и охоту','Выбрать одно основное ремесло','Не покупать дорогой Манос до понимания окупаемости'],body:`
        <section class="guide-section"><h2 class="section-title">Выбор по стилю игры</h2><div class="activity-grid"><div class="activity-card"><div class="activity-head"><div class="activity-icon">С</div><div><h3>Сбор</h3><small>активно · энергия</small></div></div><p>Понятный вход: инструмент, ресурс и расход энергии. Хорошо сочетается с алхимией и кулинарией.</p></div><div class="activity-card"><div class="activity-head"><div class="activity-icon">О</div><div><h3>Охота</h3><small>активно · бой</small></div></div><p>Отдельная экипировка и фитильное ружьё, движение по маршруту и разделка добычи.</p></div><div class="activity-card"><div class="activity-head"><div class="activity-icon">К</div><div><h3>Кулинария</h3><small>подготовка · производство</small></div></div><p>Рецепты, рабочие и массовый крафт. Доход требует расчёта цены ингредиентов и имперской поставки.</p></div><div class="activity-card"><div class="activity-head"><div class="activity-icon">Р</div><div><h3>Рыбалка</h3><small>спокойно · фон</small></div></div><p>Удобна для AFK. Чудесный аквариум добавляет слоты и увеличивает срок хранения рыбы.</p></div><div class="activity-card"><div class="activity-head"><div class="activity-icon">Л</div><div><h3>Лошади</h3><small>долгий проект</small></div></div><p>Автопуть, ловля, навыки и разведение. Имеет отдельный подробный маршрут до T9/T10.</p></div><div class="activity-card"><div class="activity-head"><div class="activity-icon">М</div><div><h3>Море и бартер</h3><small>логистика · отдельная экономика</small></div></div><p>Требует корабль, склады товаров и долгий проект. Не начинай ради «быстрого серебра».</p></div></div></section><section class="guide-section"><h2 class="section-title">Тест до покупки Маноса</h2><ol class="instruction-list"><li>Пройди учебную цепочку и используй выданную одежду/инструмент.</li><li>Сделай три сессии по 30–60 минут и запиши расход энергии, материалы, чистое серебро и насколько тебе понравился процесс.</li><li>Забери доступные аксессуары Флорамус: они сопоставимы с Манос III и позволяют проверить сборку без полной дорогой покупки.</li><li>Только затем считай прирост мастерства от следующей вещи Маноса и срок окупаемости.</li></ol><div class="callout good"><b>Хорошее ремесло — то, которое хочется повторять.</b>Максимальная прибыль на таблице не поможет, если система раздражает и экипировка простаивает.</div></section>`,sources:[['Razorback · Полезные ремесленные награды','https://vk.com/@mavrein-quest-tips']]},
      {id:'horses',title:'Лошади',lead:'Сначала получи удобный транспорт. Рысак, Иллюзия и Крогдаллор — последовательные проекты, а не обязательная покупка в первый день.',goal:'Уметь поймать, развить и оценить лошадь, затем выбрать путь к T9/T10.',tasks:['Пройти уроки укрощения Академии Оливии','Научиться ловить лошадь лассо и сахаром','Открыть P верхом и проверить навыки транспорта','Прокачать Укрощение заданиями повышения уровня','Понять требования рысака 8 ранга','Только затем готовить пробуждение T9'],body:`
        <section class="guide-section"><h2 class="section-title">Маршрут развития</h2><div class="flow"><div class="flow-node"><b>Обычная лошадь</b><small>быстрый транспорт</small></div><span class="flow-arrow">→</span><div class="flow-node"><b>Рысак 8 ранга</b><small>30 уровень + 7 навыков рысака</small></div><span class="flow-arrow">→</span><div class="flow-node"><b>Иллюзия T9</b><small>Адуанит / Дайн / Дум</small></div><span class="flow-arrow">→</span><div class="flow-node"><b>Иллюзия грёз T10</b><small>пара T9 одного вида</small></div><span class="flow-arrow">→</span><div class="flow-node"><b>Крогдаллор</b><small>гараж на 5 особых коней</small></div></div><div class="figure-grid"><figure class="guide-figure"><img loading="lazy" src="https://sun9-55.userapi.com/s/v1/ig2/4ssC5rO-gTq3PVx2MMoLdmxVD2tUJBg2-9QWskHurBNQiwYkwFZHJ57HSQ2xw7zRRcjNiLLvYCpQSTdIqUpdlask.jpg?quality=95&amp;as=32x33,48x50,72x75,108x112,160x166,240x249,360x374,480x499,540x561,640x665,720x748,1050x1091&amp;from=bu&amp;cs=72x0" alt="Гараж Крогдаллор"><figcaption>Крогдаллор — финальная цель коневодства: особый гараж и призыв связанных коней. Из Razorback JSON.</figcaption></figure></div></section>
        <section class="guide-section"><h2 class="section-title">Первые шаги укротителя</h2><ol class="instruction-list"><li>Пройди обучающие задания <b>Академии Оливии</b>: там показывают создание Куска коричневого сахара, работу с лассо и дают опыт ремесла.</li><li>Продолжай цепочку <b>[Ремесло] [Повышение уровня] Искусство укрощения</b>. Задания «Прославление клана» открываются последовательно и требуют предыдущий этап.</li><li>Для ловли возьми несколько лассо и Кусков коричневого сахара. Подойди к дикой лошади, используй лассо, продвигайся только когда она спокойна, затем покорми и попробуй сесть.</li><li>Зарегистрируй пойманную лошадь у конюха. Верхом нажми <span class="kbd">P</span> → «Выбор транспорта» → «Все»: здесь видны ранги, окрасы и симулятор скрещивания.</li><li>Качай лошадь автопутём в безопасной местности. Проверяй изученные навыки после каждого уровня и не трать купоны смены навыка без плана.</li></ol></section>
        <section class="guide-section"><h2 class="section-title">Зачем повышать Укрощение</h2><div class="how-grid"><div class="how-card"><b>Быстрее растёт уровень</b><small>Лошадь получает больше опыта транспорта за то же время движения.</small></div><div class="how-card"><b>Лучше навыки</b><small>Повышается шанс приобретения навыков при росте уровня.</small></div><div class="how-card"><b>Выше минимум характеристик</b><small>Растёт нижняя граница прибавки скорости при повышении уровня.</small></div><div class="how-card"><b>Инструменты</b><small>Ремесленные аксессуары, одежда и кнут Маноса, реликвии, расходники и питомцы Хэтэ помогают, но покупаются после понимания пользы.</small></div><div class="how-card"><b>Вечное лассо</b><small>Долгосрочная награда линии развития укрощения — удобство для дальнейшей ловли.</small></div><div class="how-card"><b>Имперская продажа</b><small>Лошади 15 уровня и выше дают Цветки заблуждений — материал для будущих T10.</small></div></div></section>
        <section class="guide-section"><h2 class="section-title">Рысак, T9 и T10 без путаницы</h2><ol class="instruction-list"><li><b>Рысак</b> — не отдельный ранг, а статус лошади с полным набором требуемых навыков. Для 8 ранга нужно семь навыков рысака; точный список смотри в информации о транспорте.</li><li>Для попытки T9 нужна лошадь <b>8 ранга, 30 уровня, со статусом рысака</b>. Материалы тренировки распределяются по направлениям, затем выполняется попытка пробуждения.</li><li>T9 бывает трёх видов: Адуанит, Дайн и Дум. Выбор определяет передвижение и стиль, поэтому сначала посмотри навыки каждого.</li><li>T10 создаётся из пары T9 одного вида и требует редкие материалы. Корни папоротника берутся в повторяемых заданиях Рианны, Цветки заблуждений — в том числе за имперскую продажу лошадей.</li><li>Текущие бесплатные награды T9/T10 проверяй в <span class="kbd">Y</span> и актуальном пути развития: набор доступных подарков меняется. Не покупай дубликат до проверки пола и уже выданных коней.</li></ol><div class="completion"><b>Переходить к пробуждению пора, если:</b> есть рысак 8 ранга 30 уровня, ты выбрал желаемую T9, понимаешь расход материалов и готов продолжать пользоваться текущей лошадью при неудачах.</div></section>`,sources:[['Razorback · Коневодство','https://vk.com/@mavrein-horse']]},
      {id:'ocean',title:'Море и корабли',lead:'Океан — отдельная ветка развития: бартер создаёт запас товаров, корабль проходит несколько улучшений, а Монеты ворон копятся на обязательные детали.',goal:'Открыть бартер, построить Каравеллу и заранее выбрать специализацию галеона Эферии.',tasks:['Пройти вводную морскую цепочку и получить судно','Создать запас товаров бартера 1–5 уровней','Понять переговоры и обновления обменов','Собрать Каравеллу или Фрегат','Выбрать специализацию галеона до крафта','Не тратить Монеты ворон вне списка','Начать материалы обвеса Чиро только после галеона'],body:`
        <section class="guide-section"><h2 class="section-title">Полная карта кораблей</h2><div class="flow"><div class="flow-node"><b>Парусник Бартелли</b><small>обучение</small></div><span class="flow-arrow">→</span><div class="flow-node"><b>Парусник / Бригантина Эферии</b><small>ветка бартера / боя</small></div><span class="flow-arrow">→</span><div class="flow-node"><b>Каравелла / Фрегат</b><small>средний корабль</small></div><span class="flow-arrow">→</span><div class="flow-node"><b>Галеон Эферии</b><small>4 специализации</small></div><span class="flow-arrow">→</span><div class="flow-node"><b>Обвес Чиро</b><small>финальный долгий проект</small></div></div><div class="figure-grid"><figure class="guide-figure"><img loading="lazy" src="https://sun9-35.userapi.com/s/v1/ig2/khquSsBQE1Q1YgMifoB0rFkY9VhpVnQjyUSJxw7Qk8IrE2os3yOR_F9EJzAtnlUoUWuFuHFndmJJCsm4kUEM5QHe.jpg?quality=95&amp;as=32x27,48x40,72x60,108x90,160x133,240x200,360x300,480x400,540x450,640x533,720x600,1080x899,1196x996&amp;from=bu&amp;cs=72x0" alt="Схема улучшения кораблей Black Desert"><figcaption>Схема веток кораблей из Razorback JSON. Перед улучшением проверь, к какому галеону ведёт твой корпус.</figcaption></figure></div></section>
        <section class="guide-section"><h2 class="section-title">Бартер с нуля</h2><ol class="instruction-list"><li>Пройди рекомендуемую морскую цепочку и получи стартовое судно. Назначь одного персонажа моряком: оставь на нём ремонтные материалы, еду и место в инвентаре.</li><li>Открой карту <span class="kbd">M</span> и окно бартера. Сначала меняй <b>обычные сухопутные материалы → товар 1 уровня</b>, затем 1 → 2 → 3 → 4 → 5.</li><li>Не продавай весь товар высокого уровня. Храни ассортимент на складе Илии: будущий обмен часто требует именно тот предмет, который только что казался лишним.</li><li><b>Переговоры</b> — лимит обменов одного обновления. Смотри стоимость сделки до отплытия и объединяй острова в маршрут.</li><li>Обновляй список по цели: обычный обмен для цепочки товаров, обмен материалов — когда собираешь корабль. Для корабельных материалов нужен запас разных товаров 2–5 уровней.</li><li>Товар 5 уровня можно превращать в серебро или менять на редкие материалы/Монеты ворон. Сначала пополняй запас, затем продавай избыток.</li></ol><div class="figure-grid"><figure class="guide-figure"><img loading="lazy" src="https://sun9-44.userapi.com/s/v1/ig2/gVUQR33RFxejDxIkAxlpmX3Z_36N5ptj4zvCGiIGyvwR2QeNKtDOyWbSwSSXW2dt4fjDmg6fT8geK3wLB4W_RA0n.jpg?quality=95&amp;as=32x22,48x33,72x50,108x75,160x111,240x167,360x251,480x334,540x376,640x446,720x501,1024x713&amp;from=bu&amp;cs=72x0" alt="Окно бартера Black Desert"><figcaption>Окно обменов: фильтруй по уровню товара, количеству и наличию на складе. Из Razorback JSON.</figcaption></figure></div></section>
        <section class="guide-section"><h2 class="section-title">Каравелла: первый большой проект</h2><div class="how-grid"><div class="how-card"><b>Корпус</b><small>Проверь исходное судно и список улучшения у смотрителя пристани. Неправильная ветка приведёт к другому типу корабля.</small></div><div class="how-card"><b>Дерево, металл и клей</b><small>Рабочие производят большие объёмы обычных материалов. В JSON отдельно подчёркнуто: часть морского крафта всегда создаётся по 1, без критического результата.</small></div><div class="how-card"><b>Материалы бартера</b><small>Обмен товаров 2 уровня на корабельные материалы обычно эффективнее охоты на Хекару.</small></div><div class="how-card"><b>Ежедневное задание Илии</b><small>«[Бартер][Ежедневно] Шумный остров Илия» требует 15 обменов и даёт компоненты улучшения.</small></div><div class="how-card"><b>Еженедельное задание выдр</b><small>«Лакомство для молодых выдр» требует кораллы и даёт редкие морские материалы.</small></div><div class="how-card"><b>Старый обвес</b><small>Покупается у Филаферто Палацио в Эферии, усиливается Чёрными камнями волн и восстанавливает прочность копиями.</small></div></div><div class="completion"><b>Перед нажатием «Улучшение судна»:</b> сверь четыре предмета обвеса, количество каждого материала и название итогового корабля прямо в доке.</div></section>
        <section class="guide-section"><h2 class="section-title">Какой галеон выбрать</h2><div class="activity-grid"><div class="activity-card"><div class="activity-head"><div class="activity-icon">П</div><div><h3>Прогресс</h3><small>бартер и груз</small></div></div><p>Главный выбор для бартера: вместимость и удобство длинных цепочек. Именно эту ветку подробно собирает Razorback.</p></div><div class="activity-card"><div class="activity-head"><div class="activity-icon">Х</div><div><h3>Храбрость</h3><small>морской бой</small></div></div><p>Выбор для охоты на морских монстров и урона пушек. Требует понимания боевой ветки и регулярного снабжения.</p></div><div class="activity-card"><div class="activity-head"><div class="activity-icon">Л</div><div><h3>Полёт</h3><small>скорость</small></div></div><p>Ставка на скорость и ускорение. Выбирай только если время в пути для тебя важнее груза и боевой эффективности.</p></div><div class="activity-card"><div class="activity-head"><div class="activity-icon">Б</div><div><h3>Баланс</h3><small>гибрид</small></div></div><p>Средние характеристики без сильной специализации. Это осознанный универсальный выбор, но не лучший автоматически.</p></div></div><div class="callout warn"><b>Выбор делается до траты месяцев материалов.</b>Если основная цель — бартер, ориентируйся на «Прогресс»; если морские монстры — сравни «Храбрость» и «Полёт» по фактическим статам.</div></section>
        <section class="guide-section"><h2 class="section-title">Галеон «Прогресс» и Чиро: что копить заранее</h2><table class="compact-table"><thead><tr><th>Группа</th><th>Основной источник</th><th>Правило новичка</th></tr></thead><tbody><tr><td>Лунная ткань и фанера</td><td>Сушка жил и чешуи Хана</td><td>Ходи на Хана с гильдией и не продавай материалы.</td></tr><tr><td>Материалы 4–5 уровня</td><td>Бартер и морские задания</td><td>Не пропускай обмены на Океаническое тёмное железо и реликвии Вако.</td></tr><tr><td>Реликвия Вако (битва)</td><td>Ежедневные/еженедельные задания, бартер 5 уровня</td><td>Это один из самых медленных компонентов — выбирай его в разведочных наградах.</td></tr><tr><td>Слеза глубин</td><td>Морские задания, редкий бартер, обмен</td><td>Не покупай за Монеты ворон без расчёта всего проекта.</td></tr><tr><td>Зелёный обвес галеона</td><td>Лавиния/Ливиния/Лювиния</td><td>40 000 Монет ворон за комплект — обязательная трата.</td></tr><tr><td>Обвес Чиро</td><td>Мастерская Илии, узлы островов, морские материалы</td><td>Нужны влияние, рабочие, чертежи и большой запас камней усиления.</td></tr></tbody></table><div class="callout warn"><b>Монеты ворон — бюджет проекта.</b>По расчёту Razorback, Чиро для «Прогресса» требует минимум около 200 000 Монет ворон при крафте части компонентов и до 400 000 при прямой покупке. Поэтому не трать монеты на удобства до готовой таблицы материалов.</div><div class="route-gate"><span><b>Когда морская ветка завершена:</b> есть галеон выбранной специализации, четыре предмета подходящего обвеса, открыты нужные островные узлы и понятен недельный источник каждого редкого материала.</span></div></section>`,sources:[['Razorback · Введение в топ-корабли','https://vk.com/@mavrein-ships'],['Razorback · Судоходство и бартер','https://vk.com/@mavrein-barter'],['Razorback · Галеон «Прогресс»','https://vk.com/@mavrein-galeon-craft']]},
      {id:'treasures',title:'Сокровища',lead:'Сокровище — долгий семейный проект с постоянным удобством. Новичку обычно полезнее начать с бесконечных зелий.',goal:'Выбрать одно сокровище, знать его эффект, детали и точку сборки.',tasks:['Выбрать Онет или Одо по потребности класса','Взять повторяемые недельные задания на фрагменты','Складывать редкие детали отдельно и не продавать','Собирать части только через Мешочек Яз по схеме','Не начинать второе редкое сокровище до завершения первого'],body:`
        <section class="guide-section"><h2 class="section-title">Как выбрать проект</h2><div class="gear-timeline"><div class="gear-stage"><span>1</span><div><b>Эссенция духов: Онет</b><small>Бесконечное восстановление HP. Самое универсальное первое сокровище для охоты и безопасности.</small></div></div><div class="gear-stage"><span>2</span><div><b>Эссенция духов: Одо</b><small>Бесконечное восстановление ресурса класса. Ценность зависит от того, насколько быстро твой класс расходует MP/WP/SP.</small></div></div><div class="gear-stage"><span>3</span><div><b>Карта, компас или телескоп</b><small>Телепорты и навигация. Выбирай только под конкретную привычку: возвращение со спота, сбор группы или перемещение к союзнику.</small></div></div><div class="gear-stage"><span>4</span><div><b>Перстень и Ноуль</b><small>Очень долгие экономические и морские проекты. Не являются обязательным продолжением экипировки.</small></div></div></div></section>
        <section class="guide-section"><h2 class="section-title">Онет и Одо — пошагово</h2><ol class="instruction-list"><li>Реши, что мешает чаще: нехватка здоровья или ресурса класса. Не фарми обе банки одновременно.</li><li>Открой страницу Razorback по ссылке ниже и выпиши <b>три основные редкие части</b> выбранной банки и места их добычи.</li><li>У соответствующих НИП бери повторяемые еженедельные задания: они дают по 6 сборных фрагментов и превращают неудачные недели в гарантированный прогресс.</li><li>Собери по 100 фрагментов нужной части либо выбей её целиком. Цельные предметы с пометкой <b>«Древний»</b> нужны только для именной версии — не смешивай варианты случайно.</li><li>Получив все компоненты, разложи их в <b>Мешочке Яз</b> строго по схеме из памятки. Если сборка не загорается, проверь ориентацию и названия каждой детали.</li><li>Положи готовую банку в инвентарь аккаунта. С подходящим навыком феи настрой автоматическое использование на нужном проценте HP или ресурса.</li></ol><div class="figure-grid"><figure class="guide-figure"><img loading="lazy" src="https://sun9-75.userapi.com/s/v1/ig2/KRMvlHIobFHK7oR1UMRkcBqLurA5czeh0q6bu7x8xoZcownDNXrfcnY0u3LqS8-b1EF2XLjD47Befo53XPHfFAc0.jpg?quality=95&amp;as=32x18,48x27,72x40,108x60,160x89,240x134,360x201,480x268,540x301,640x357,720x402,814x454&amp;from=bu&amp;cs=72x0" alt="Памятка по частям бесконечного зелья"><figcaption>Памятка Razorback по компонентам и расположению в Мешочке Яз. Нажми на изображение, чтобы открыть исходный размер.</figcaption></figure></div></section>
        <section class="guide-section"><h2 class="section-title">Что дают остальные сокровища</h2><div class="activity-grid"><div class="activity-card"><div class="activity-head"><div class="activity-icon">К</div><div><h3>Карта благородного учёного</h3><small>4 редкие части</small></div></div><p>Телепортирует как Карта путешественника, но в течение 30 минут позволяет вернуться в исходное место. Части опознаются у НИП Дневник Кафраса, затем собираются в Мешочке Яз.</p></div><div class="activity-card"><div class="activity-head"><div class="activity-icon">C</div><div><h3>Мощный компас</h3><small>3 редкие части</small></div></div><p>Показывает положение в пустыне и море и позволяет призвать к себе до четырёх членов группы; приглашённым даётся время подтвердить перенос. Части опознаются у Айн Грейд.</p></div><div class="activity-card"><div class="activity-head"><div class="activity-icon">T</div><div><h3>Телескоп Рафи Бэдмаунтина</h3><small>3 редкие части</small></div></div><p>Обратная логика компаса: позволяет самому переместиться к члену группы, отряда или гильдии. Это поздний проект Улу-Киты.</p></div><div class="activity-card"><div class="activity-head"><div class="activity-icon">%</div><div><h3>Перстень старьёвщика</h3><small>5 редких частей</small></div></div><p>Добавляет 5% к снижению комиссии Центрального аукциона. Фрагменты можно оценить у Шакату и собрать в форме Аль Юрада либо исходной форме.</p></div><div class="activity-card"><div class="activity-head"><div class="activity-icon">N</div><div><h3>Ноуль Эвенлиз</h3><small>морское сокровище</small></div></div><p>Для галеона Эферии и Пханоксона: после «Рывка» позволяет дополнительный рывок без расхода выносливости с увеличенной дистанцией. Нужны «Эвенлиз» и «Узорчатый ноуль».</p></div></div><div class="callout warn"><b>Редкая часть важнее текущей цены продажи.</b>Если предмет незнаком и имеет описание сокровища, положи его в отдельный склад и сначала сверь название со страницей Razorback.</div></section>`,sources:[['Razorback · Редкости и схемы','https://vk.com/@mavrein-treasure']]}
    ]},
    {id:'routine',icon:'08',title:'Что делать дальше',sub:'рутина и ориентиры',topics:[
      {id:'weekly',title:'Недельный план без перегруза',lead:'Не нужно закрывать всё. Выбери 2–4 постоянные активности по своей силе, группе и нужной награде.',goal:'Составить реальный недельный маршрут и понимать, что именно он приносит.',tasks:['Забрать доступные Разломы тьмы','Выбрать один одиночный недельный контент','Выбрать один групповой недельный контент','Проверить расписание гильдии','Продать или сохранить добычу осознанно','Оставить свободный вечер без обязательств'],body:`
        <section class="guide-section"><h2 class="section-title">Сначала выбери награду</h2><div class="how-grid"><div class="how-card"><b>Нужно серебро</b><small>Разломы тьмы и гильдийные боссы дают понятные продаваемые трофеи. Итог считай по текущему аукциону.</small></div><div class="how-card"><b>Нужны Камни Крон</b><small>Разломы тьмы и Атораксион после обновлений конца 2025 года стали постоянными источниками Кронов.</small></div><div class="how-card"><b>Нужны материалы усиления</b><small>Атораксион, Черный храм и Алтарь крови дают сундуки и материалы, зависящие от сложности и результата.</small></div><div class="how-card"><b>Играешь один</b><small>Разломы, Черный храм и Бездна бессмертия. Сначала выбирай комфортную сложность, затем повышай её.</small></div><div class="how-card"><b>Есть группа</b><small>Атораксион и Алтарь крови. Перед входом уточни механику и требования группы.</small></div><div class="how-card"><b>Есть гильдия</b><small>Еженедельная цепочка гильдийных боссов по расписанию. Подробная последовательность открывается по ссылке ниже.</small></div></div></section>
        <section class="guide-section"><h2 class="section-title">Постоянные активности</h2><div class="callout good"><b>Разломы тьмы — важная регулярная активность.</b>Их стоит закрывать каждый откат: много серебра и материалов, по 100 Камней Крон с каждого босса, одиночное прохождение и отсутствие обычного штрафа за смерть. Это не единственный и не всегда главный недельный контент, но игнорировать накопившиеся Разломы невыгодно.</div><div class="activity-grid">
          <article class="activity-card" style="border-color:#b18a3c"><div class="activity-head"><div class="activity-icon">R</div><div><h3>Разломы тьмы</h3><small>важно закрывать по откату · 120 часов</small></div></div><p>Это не общий недельный сброс: побеждённый босс появляется снова примерно через 5 дней. Открой значок Разлома или карту, проложи путь и убей всех доступных боссов, не оставляя их надолго копиться.</p><div class="stat-tags"><span class="stat-tag">100 Крон за босса</span><span class="stat-tag">Золотые слитки</span><span class="stat-tag">Обрывки и материалы</span></div><div class="activity-meta"><span><b>Серебро:</b> у многих боссов гарантированы 8–10 слитков 100G, то есть 800 млн–1 млрд серебра, плюс остальные трофеи.</span><span><b>Риск:</b> смерть от босса Разлома не даёт обычного штрафа.</span><span><b>Правило:</b> появился Разлом — закрой при первой удобной возможности; более слабая стадия босса допустима, награду важнее забрать.</span></div></article>
          <article class="activity-card"><div class="activity-head"><div class="activity-icon">A</div><div><h3>Атораксион</h3><small>группа · 1 недельная награда</small></div></div><p>Четыре крепости с механиками и финальными боссами. С декабря 2025 года сложность объединена, а недельная награда выдаётся один раз с увеличенным объёмом.</p><div class="stat-tags"><span class="stat-tag">до 500 Крон за 4 боссов</span><span class="stat-tag">недельные сундуки</span><span class="stat-tag">шанс аксессуаров</span></div><div class="activity-meta"><span><b>Серебро:</b> переменное — зависит от содержимого сундуков и цены материалов.</span><span><b>Новичку:</b> сначала найди обучающую группу и посмотри механику конкретной крепости.</span></div></article>
          <article class="activity-card"><div class="activity-head"><div class="activity-icon">Б</div><div><h3>Бездна бессмертия</h3><small>одиночно · недельное прохождение</small></div></div><p>Серия дуэлей с особыми механиками. После изменения 2025 года контент переведён с ежедневного на недельный формат.</p><div class="stat-tags"><span class="stat-tag">Печати бессмертия</span><span class="stat-tag">Обсидиан Черного ворона</span><span class="stat-tag">магазин обмена</span></div><div class="activity-meta"><span><b>Серебро:</b> не прямое; ценность определяется тем, на что обмениваешь печати.</span><span><b>Совет:</b> если босс не получает урон, остановись и изучи его механику — грубой силой многие этапы не пройти.</span></div></article>
          <article class="activity-card"><div class="activity-head"><div class="activity-icon">Х</div><div><h3>Черный храм</h3><small>одиночно · подсчёт в воскресенье</small></div></div><p>Выбери знакомого босса и доступную сложность. Награда зависит от победы и рейтинга; с апреля 2026 года она автоматически приходит в Сундук с подарками Черного духа после воскресного подсчёта.</p><div class="stat-tags"><span class="stat-tag">недельный трофей</span><span class="stat-tag">рейтинг боя</span><span class="stat-tag">материалы региона</span></div><div class="activity-meta"><span><b>Серебро:</b> переменное; оценивай содержимое фактически полученного сундука.</span><span><b>Не потеряется:</b> награды теперь накапливаются в сундуке Черного духа.</span></div></article>
          <article class="activity-card"><div class="activity-head"><div class="activity-icon">К</div><div><h3>Гильдийные боссы</h3><small>рейд · по расписанию гильдии</small></div></div><p>Обычно гильдия убивает несколько боссов цепочкой. Требуются правильный канал, сбор в рейд и выход из статуса ученика по правилам гильдии.</p><div class="stat-tags"><span class="stat-tag">ценные трофеи</span><span class="stat-tag">серебро после продажи</span><span class="stat-tag">групповой контент</span></div><div class="activity-meta"><span><b>Серебро:</b> Razorback приводит пример 4,5–5 млрд за их недельный набор; это ориентир автора, не гарантия.</span><span><button class="term-link" data-go="guild">Открыть подробный гайд по гильдии</button></span></div></article>
          <article class="activity-card"><div class="activity-head"><div class="activity-icon">A</div><div><h3>Алтарь крови</h3><small>3 игрока или подбор · лучший результат недели</small></div></div><p>Защищай реликвию на уровнях сложности. В воскресенье в 00:00 приходит одна награда за самый высокий пройденный за неделю уровень — результаты не складываются.</p><div class="stat-tags"><span class="stat-tag">еженедельный сундук</span><span class="stat-tag">Источник насыщения</span><span class="stat-tag">первая награда уровня</span></div><div class="activity-meta"><span><b>Серебро:</b> на 15+ уровне гарантированный Блестящий источник насыщения имеет аукционный диапазон, но цена меняется; проверь рынок перед продажей.</span><span><b>Порог:</b> поздний групповой контент, не обязательный для свежего персонажа.</span></div></article>
        </div></section>
        <section class="guide-section"><h2 class="section-title">Готовый щадящий маршрут</h2><div class="mini-route"><span>Понедельник: проверить Разломы</span><i>→</i><span>Один вечер: Черный храм или Бездна</span><i>→</i><span>Один вечер: гильдия или Атораксион</span><i>→</i><span>Воскресенье: забрать автоматические награды</span></div><div class="callout good"><b>Достаточно трёх пунктов.</b>Разломы + один одиночный режим + одна групповая активность уже образуют здоровую неделю. Всё остальное — только если хочется.</div></section>`,sources:[['Официально · Разлом тьмы','https://www.ru.playblackdesert.com/Wiki/Default?wikiNo=247'],['Официально · Атораксион и Разлом, 18.12.2025','https://www.ru.playblackdesert.com/News/Notice/Detail?boardNo=11773&boardType=0&countryType=ru-RU&currentPage=1'],['Официально · Черный храм, 16.04.2026','https://www.ru.playblackdesert.com/News/Notice/Detail?boardNo=12305&boardType=0&countryType=ru-RU&currentPage=1'],['Официально · Алтарь крови','https://www.ru.playblackdesert.com/Wiki/Default?wikiNo=174'],['Официально · изменение Бездны бессмертия, 24.07.2025','https://www.ru.playblackdesert.com/News/Notice/Detail?boardNo=11137&countryType=ru-RU']]},
      {id:'next-goal',title:'Выбрать следующую цель',lead:'Хорошая цель отвечает на вопрос «что изменится после её выполнения».',goal:'Не копить ресурсы и не тратить их без понятного результата.',tasks:['Записать текущие итоговые статы','Выбрать следующий спот или контент','Найти минимальный недостающий порог','Купить или сделать самое выгодное улучшение под этот порог'],body:`
        <div class="flow"><div class="flow-node"><b>Хочу контент</b><small>спот / море / босс</small></div><span class="flow-arrow">→</span><div class="flow-node"><b>Нужен порог</b><small>урон / защита / судно</small></div><span class="flow-arrow">→</span><div class="flow-node"><b>Считаю варианты</b><small>цена и время</small></div><span class="flow-arrow">→</span><div class="flow-node"><b>Делаю один шаг</b><small>проверяю результат</small></div></div><section class="guide-section"><h2 class="section-title">Шаблон одной цели</h2><ol class="instruction-list"><li><b>Результат:</b> «Хочу уверенно фармить конкретный спот», а не «хочу больше атаки».</li><li><b>Текущая точка:</b> запиши отображаемую и итоговую атаку/защиту, меткость и проблемный слот.</li><li><b>Недостающий порог:</b> найди требование локации и добавь запас на комфорт, а не вход впритык.</li><li><b>Варианты:</b> бесплатная награда, кристаллы, дневник, покупка готового предмета или усиление.</li><li><b>Цена:</b> раздели стоимость на полезный прирост и учти расходники/ремонт.</li><li><b>Проверка:</b> после одного улучшения снова сделай часовой тест. Не покупай следующие три вещи автоматически.</li></ol><div class="how-grid"><div class="how-card"><b>Боевая цель</b><small>Новый спот → итоговые статы → самый дешёвый порог.</small></div><div class="how-card"><b>Ремесленная цель</b><small>Конкретный рецепт/доход → мастерство → срок окупаемости.</small></div><div class="how-card"><b>Морская цель</b><small>Тип активности → корабль → материалы текущей ступени.</small></div></div><div class="completion"><b>Цель сформулирована правильно, если:</b> известны результат, одна следующая покупка, её цена и способ проверить эффект.</div></section>`},
      {id:'reference',title:'Шпаргалка',lead:'Минимум терминов и клавиш, чтобы быстро вернуться в игру после перерыва.',goal:'Найти нужное окно или понять разговор игроков за минуту.',tasks:['Запомнить Esc-поиск вместо всех меню','Знать разницу AP/DP и итоговых статов','Понимать V, Кафрас, фейлы и Кроны','Сохранить страницу в закладки'],body:`
        <div class="grid"><div class="card"><h2>Слова</h2><p><b>AP</b> — атака · <b>DP</b> — защита · <b>спот</b> — место фарма · <b>фейлы</b> — шанс усиления · <b>бижа</b> — аксессуары · <b>обвес</b> — оборудование транспорта.</p></div><div class="card"><h2>Римские уровни</h2><p>I → II → III → IV → V. У некоторых современных предметов развитие продолжается до X.</p></div></div>

    title:'Тувалла V: получить готовый комплект',
    lead:'Теперь сезон сам выдаёт усиленную до V Туваллу за уровни и выбор боевого стиля. Нару и ручное усиление Туваллы для нового маршрута не нужны.',
    goal:'Надеть полный комплект Туваллы V и не потратить редкие материалы на уже готовую экипировку.',
    tasks:['Получить основное оружие V на 40-м уровне','Получить четыре части брони V на 45–52-м уровнях','Завершить Пробуждение или Наследие и забрать пробуждённое оружие V','На 53-м и 59-м уровнях открыть сундуки аксессуаров и заполнить все слоты'],
    body:`
      <div class="callout good"><b>Что изменилось 30.07.2026.</b> Тувалла V теперь сразу имеет характеристики снаряжения босса V. Купоны обмена Туваллы на босс-снаряжение и старые задания Джетины удалены. Не ищи их по старым видео.</div>

    lead:'Повторяемые дела должны двигать текущий этап развития. Гипермаршрут добавил приоритет Академии и поддержки Чёрного храма, но Разломы тьмы по-прежнему стоит закрывать каждый откат.',
    tasks:['Закрыть появившиеся Разломы тьмы','Выполнить доступные еженедельные задания Академии','Продвинуть одного нужного босса Чёрного храма','Оставить время на сюжет, фарм или отдых'],
    body:`<section class="guide-section"><h2 class="section-title">Недельный минимум новичка</h2><div class="activity-grid"><article class="activity-card priority"><b>Разломы тьмы</b><p>Проверяй при каждом входе и закрывай накопившихся боссов: это важный повторяемый источник коробок, материалов и серебра. Боссы не исчезают мгновенно, поэтому собери их в один удобный вечер.</p></article><article class="activity-card"><b>Академия Оливии</b><p>До недельного сброса выполни доступные курсы и задания текущего семестра. Они напрямую ускоряют оружие, броню и аксессуары.</p></article><article class="activity-card"><b>Чёрный храм Тонхэ</b><p>Работай над одной требуемой сложностью для следующей бесплатной части брони, а не распыляйся на всех боссов.</p></article><article class="activity-card"><b>Один личный источник серебра</b><p>Спот, ремесло или море — выбери один понятный цикл. Доход нужен на усиление, а не ради абстрактной суммы.</p></article></div></section><div class="callout"><b>Порядок при нехватке времени:</b> Разломы тьмы → ограниченные задания Академии → следующий предмет развития → всё остальное по желанию.</div>`,
    sources:hyperSources
  });

  updateTopic('magnus',{
    title:'Магнус: удобства и условие Сердца Камос',
    lead:'Магнус по-прежнему соединяет склады и открывает быстрые перемещения. Сундук брони босса V остаётся полезной альтернативой, но больше не является обязательной ступенью к Усыпальнице времён.',
    goal:'Открыть аккаунтные удобства, получить запасную броню и выполнить условие для первого Обработанного сердца Камос.',
    tasks:['Принять основную цепочку Abyss One: Магнус','Открывать артерии бездны по мере прохождения','Завершить «[Магнус] Цена помощи»','Выбрать броню босса V только после проверки уже полученных слотов'],
    body:`<div class="compare"><div><h3>Склады</h3><p>Через кладовщика и горничных можно пользоваться складами открытых регионов.</p></div><div><h3>Перемещение</h3><p>Колодцы связывают крупные регионы за серебро и сокращают дорогу.</p></div></div><section class="guide-section"><h2 class="section-title">Как пройти без потери нити</h2><ol class="instruction-list"><li>У Чёрного духа прими <b>[Abyss One] Магнус</b> и иди к указанному колодцу.</li><li>Внутри выбирай текущую Бездну по маркеру; после решения всегда возвращайся к Ву Джу и заканчивай диалог.</li><li>Дойди до задания <b>«[Магнус] Цена помощи»</b>. Вместе со 100 часами игры оно нужно для достижения с первым Обработанным сердцем Камос.</li><li>После финала проверь кладовщика и доступные колодцы, затем открой сундук брони босса V.</li></ol></section><section class="guide-section"><h2 class="section-title">Что делать с бронёй босса V</h2><p>Сначала сравни её со слотами, которые выдаёт Чёрный храм. Броню босса можно оставить запасному персонажу или использовать в старом производственном пути с <b>уровнем Кафраса 10</b> и соответствующим пламенем, но основной новичковый маршрут теперь получает Усыпальницу напрямую.</p><div class="callout warn"><b>Не бери дубликат автоматически.</b> Проверь шлем, доспех, перчатки и обувь в инвентаре и на складе семьи до выбора.</div></section>`,
    sources:[['Официальный гайд по Магнусу',official.magnus],...hyperSources]
  });

  for(const group of groups){const topic=group.topics.find(t=>t.id==='enhance');if(topic){
    topic.body=`<div class="callout good"><b>Для нового сезонного персонажа.</b> Комплект Туваллы V уже выдаётся готовым. Используй этот раздел для Чёрной звезды, Харзата, Усыпальницы времён и дальнейшей экипировки — не трать советы и Кроны на готовую Туваллу V.</div>`+topic.body
      .replace('Не трать шанс 200+ на дешёвую Туваллу.','Не трать шанс 200+ на дешёвую или уже готовую сезонную вещь.')
      .replace('<tr><td>Тувалла</td><td>Дешевле восстановить и повторить</td><td>Не расходует редкие Кроны без особой причины</td></tr>','<tr><td>Тувалла V нового сезона</td><td>Уже выдана на максимальной нужной ступени</td><td>Не усиливает; сразу использует готовый комплект</td></tr>');
    topic.sources=[...(topic.sources||[]),...hyperSources];break
  }}

  // В интерфейсе показываем предмет по официальной иконке и названию; технические ID оставляем вне текста для новичка.
  for(const group of groups)for(const topic of group.topics)if(topic.body){
    topic.body=topic.body
      .replace(/<span class="item-id">[^<]*\bID\b[^<]*<\/span>/gi,'')
      .replace(/<a\b[^>]*>[^<]*\bID\b[^<]*<\/a>/gi,'');
  }

  const allTopics=groups.flatMap(g=>g.topics.map(t=>({...t,group:g})));
  const content=document.getElementById('content'),nav=document.getElementById('nav'),sidebar=document.getElementById('sidebar');
  const modal=document.getElementById('guideModal'),modalContent=document.getElementById('modalContent');
  let activeId=location.hash.slice(1)||'welcome',openGroup=(allTopics.find(t=>t.id===activeId)||allTopics[0]).group.id;
  let modalTopicId=null;
  let checks=JSON.parse(localStorage.getItem('bdo-evo-checks')||'{}');
  const guideSchema='2026-07-30-hyper-r2';
  if(localStorage.getItem('bdo-evo-guide-schema')!==guideSchema){
    const changedTopics=['naru-tuvala','season-exit','graduation','support-choice','gear-road','weapons','armor','accessories','journals','treasures','weekly'];
    for(const key of Object.keys(checks))if(changedTopics.some(id=>key.startsWith(id+'-')))delete checks[key];
    localStorage.setItem('bdo-evo-checks',JSON.stringify(checks));
    localStorage.setItem('bdo-evo-guide-schema',guideSchema);
  }
  const esc=s=>String(s).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
  const flowLinks={
    'Сезон':'naru-tuvala','Каменный зал':'story','Баленос':'story','Серендия':'story','Кальфеон':'story','Медия':'story','Магнус':'magnus','Тувалла':'naru-tuvala','Стиль боя':'combat-style','Усиление':'enhance','Выпуск':'season-exit',
    'Оружие X':'weapons','Броня X':'armor','Аксессуар X':'accessories','Тувалла V/X':'naru-tuvala','Чёрная звезда V':'weapons','Усыпальница':'armor','Харзат':'accessories','Вана / Идан':'gear-road','Броня босса V':'armor','Кафрас 10':'armor','Пламя':'armor',
    'Базовое судно':'ocean','Бригантина':'ocean','Каравелла':'ocean','Галеон':'ocean','Чиро':'ocean','Хочу контент':'next-goal','Нужен порог':'stats','Считаю варианты':'gear-money','Делаю один шаг':'weekly'
  };
  const termLinks={
    'нить надера':'enhance','совет валкса':'enhance','советы валкса':'enhance','камни крон':'enhance','кроны':'enhance','обрывки воспоминаний':'enhance','магнус':'magnus','итоговые показатели':'stats','кристаллы':'crystals','светящиеся камни':'crystals','чёрная звезда':'weapons','оружие вана':'weapons','пламя начала':'weapons','чёрный камень начала':'weapons','камни закалки':'weapons','броня усыпальницы':'armor','усыпальница':'armor','кафрас':'armor','идан':'armor','харзат':'accessories','деборика':'accessories','иллирия':'accessories','центральный аукцион':'market','аукцион':'market','инвентарь аккаунта':'utility-quests','фея':'utility-quests','лагерь':'utility-quests','бартер':'ocean','галеон':'ocean','эссенция онет':'treasures','эссенция одо':'treasures','дневник игоря бартелли':'journals','агрис':'buffs','наследие':'combat-style','пробуждение':'combat-style','тувалла':'naru-tuvala'
  };
  function renderNav(filter=''){
    const q=filter.trim().toLowerCase();let shown=0;
    nav.innerHTML=groups.map(g=>{const ts=g.topics.filter(t=>!q||`${g.title} ${t.title} ${t.lead}`.toLowerCase().includes(q));if(!ts.length)return'';shown+=ts.length;const opened=q||g.id===openGroup;return `<div class="group ${opened?'open':''}" data-group="${g.id}"><button class="group-btn" data-group-toggle="${g.id}"><span class="group-icon">${g.icon}</span><span><strong>${g.title}</strong><small>${g.sub}</small></span><span class="chev">›</span></button><div class="subnav">${ts.map(t=>`<button class="topic-btn ${t.id===activeId?'active':''}" data-topic="${t.id}">${t.title}</button>`).join('')}</div></div>`}).join('')||'<div class="empty">Ничего не найдено</div>';
    document.getElementById('topicCount').textContent=`${shown}/${allTopics.length}`;
    nav.querySelectorAll('[data-group-toggle]').forEach(b=>b.onclick=()=>{openGroup=b.dataset.groupToggle;const box=b.closest('.group');const was=box.classList.contains('open');nav.querySelectorAll('.group').forEach(x=>x.classList.remove('open'));if(!was)box.classList.add('open')});
    nav.querySelectorAll('[data-topic]').forEach(b=>b.onclick=()=>selectTopic(b.dataset.topic));
  }
  function topicSources(t){if(!t.sources?.length)return'';return `<div class="source-list">${t.sources.map(s=>`<a href="${s[1]}" target="_blank" rel="noopener">↗ ${s[0]}</a>`).join('')}</div>`}
  function stageVisual(t){const gi=groups.findIndex(g=>g.id===t.group.id);return `<div class="stage-visual"><span class="stage-number">${t.group.icon}</span><div><strong>${t.group.title}</strong><small>${t.group.sub} · ты находишься здесь</small><div class="stage-dots" aria-label="Этапы маршрута">${groups.map((g,i)=>`<button class="stage-dot ${i<gi?'past':''} ${i===gi?'active':''}" data-stage-topic="${g.topics[0].id}" title="${g.title}" aria-label="${g.title}"></button>`).join('')}</div></div></div>`}
  function activateFlowLinks(root){root.querySelectorAll('.flow-node').forEach(node=>{const id=flowLinks[node.querySelector('b')?.textContent.trim()];if(!id)return;node.classList.add('interactive');node.tabIndex=0;node.setAttribute('role','button');node.onclick=()=>openGuide(id);node.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();openGuide(id)}}})}
  function improveImageQuality(root){root.querySelectorAll('.guide-figure img').forEach(img=>{const src=img.getAttribute('src')||'';if(src.includes('cs=72x0'))img.src=src.replace(/&cs=72x0/,'');img.decoding='async';img.title='Нажмите, чтобы открыть изображение в полном размере';img.onclick=()=>window.open(img.currentSrc||img.src,'_blank','noopener')})}
  function linkTerms(root){const terms=Object.keys(termLinks).sort((a,b)=>b.length-a.length),rx=new RegExp(`(${terms.map(x=>x.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')).join('|')})`,'giu');const walker=document.createTreeWalker(root,NodeFilter.SHOW_TEXT),nodes=[];while(walker.nextNode()){const n=walker.currentNode,p=n.parentElement;if(n.nodeValue.trim()&&!p.closest('button,a,input,.step,.source-list,.flow-node,.eyebrow,.breadcrumb,.source-badge,h1,h2,h3'))nodes.push(n)}nodes.forEach(n=>{rx.lastIndex=0;if(!rx.test(n.nodeValue))return;rx.lastIndex=0;const frag=document.createDocumentFragment();let last=0;n.nodeValue.replace(rx,(match,_x,offset)=>{frag.append(n.nodeValue.slice(last,offset));const target=termLinks[match.toLocaleLowerCase('ru-RU')];if(target===activeId){frag.append(match);last=offset+match.length;return match}const b=document.createElement('button');b.className='term-link';b.type='button';b.textContent=match;b.onclick=()=>openGuide(target);frag.append(b);last=offset+match.length;return match});frag.append(n.nodeValue.slice(last));n.replaceWith(frag)})}
  function activateLearning(root){improveImageQuality(root);activateFlowLinks(root);linkTerms(root);root.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>openGuide(b.dataset.go))}
  function openGuide(id){const t=allTopics.find(x=>x.id===id);if(!t)return;modalTopicId=id;modalContent.innerHTML=`<div class="breadcrumb">${t.group.title}</div><h2 id="modalTitle">${t.title}</h2><p class="lead">${t.lead}</p><div class="card goal-card"><h3>Что должно получиться</h3><p>${t.goal}</p></div>${t.body||''}${topicSources(t)}`;activateLearning(modalContent);modal.classList.add('open');modal.setAttribute('aria-hidden','false');document.body.classList.add('modal-open');modal.querySelector('.modal-close').focus()}
  function closeGuide(){modal.classList.remove('open');modal.setAttribute('aria-hidden','true');document.body.classList.remove('modal-open')}
  function renderTopic(){const idx=allTopics.findIndex(t=>t.id===activeId),t=allTopics[idx]||allTopics[0];activeId=t.id;openGroup=t.group.id;
    content.innerHTML=`<div class="article-head"><div class="breadcrumb">${t.group.title} · тема ${idx+1} из ${allTopics.length}</div><div class="eyebrow">BDO GUIDE EVO</div><h1>${t.title}</h1><p class="lead">${t.lead}</p><div class="source-badge">◆ Основа: Razorback JSON · дополнено и сверено</div></div>
      <div class="grid"><div class="card goal-card"><h2>Результат</h2><p>${t.goal}</p></div><div class="card"><h2>Короткий маршрут</h2><p class="muted">Отмечай выполненное — прогресс сохраняется в браузере.</p></div></div>
      ${t.customTasks?'':`<div class="card task-card"><div class="steps">${t.tasks.map((x,i)=>{const key=`${t.id}:${i}`,done=!!checks[key];return `<label class="step ${done?'done':''}"><input type="checkbox" data-check="${key}" ${done?'checked':''}><span>${x}</span></label>`}).join('')}</div></div>`}
      <div class="topic-body">${t.body||''}</div>${topicSources(t)}
      <div class="article-nav"><button ${idx<=0?'disabled':''} data-move="-1">← ${idx>0?allTopics[idx-1].title:'Начало'}</button><button ${idx>=allTopics.length-1?'disabled':''} data-move="1">${idx<allTopics.length-1?allTopics[idx+1].title:'Финиш'} →</button></div>`;
    content.querySelectorAll('[data-check]').forEach(c=>{c.checked=!!checks[c.dataset.check];const row=c.closest('.step,.diary-card');if(row)row.classList.toggle('done',c.checked);c.onchange=()=>{checks[c.dataset.check]=c.checked;localStorage.setItem('bdo-evo-checks',JSON.stringify(checks));const currentRow=c.closest('.step,.diary-card');if(currentRow)currentRow.classList.toggle('done',c.checked);updateProgress()}});
    content.querySelectorAll('[data-move]').forEach(b=>b.onclick=()=>{const next=allTopics[idx+Number(b.dataset.move)];if(next)selectTopic(next.id)});updateProgress();
    content.querySelectorAll('[data-stage-topic]').forEach(b=>b.onclick=()=>selectTopic(b.dataset.stageTopic));activateLearning(content);
  }
  function updateProgress(){const total=allTopics.reduce((n,t)=>n+t.tasks.length,0),done=Object.entries(checks).filter(([k,v])=>v&&allTopics.some(t=>k.startsWith(t.id+':'))).length,p=Math.round(done/total*100);document.getElementById('progressFill').style.width=p+'%';document.getElementById('progressLabel').textContent=`${p}% маршрута · ${done}/${total}`}
  function selectTopic(id){const t=allTopics.find(x=>x.id===id);if(!t)return;activeId=id;openGroup=t.group.id;history.replaceState(null,'','#'+id);renderTopic();renderNav(document.getElementById('search').value);sidebar.classList.remove('open');window.scrollTo({top:0,behavior:'smooth'})}
  document.getElementById('search').oninput=e=>renderNav(e.target.value);
  document.getElementById('menuToggle').onclick=()=>sidebar.classList.toggle('open');
  modal.querySelectorAll('[data-modal-close]').forEach(b=>b.onclick=closeGuide);
  document.getElementById('openFullTopic').onclick=()=>{const id=modalTopicId;closeGuide();if(id)selectTopic(id)};
  document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(modal.classList.contains('open'))closeGuide();else sidebar.classList.remove('open')}});
  renderTopic();renderNav();
  </script>
</body>
</html>
