let state=JSON.parse(localStorage.getItem('bdo-ship-progress-v1')||'{}');const K=(s,i)=>s+'_'+i;function save(){localStorage.setItem('bdo-ship-progress-v1',JSON.stringify(state));render()}function setN(s,i,n){state[K(s,i)]=Math.max(0,Math.floor(Number(n)||0));save()}
const isGear=id=>id.includes('permit')||D[id][0].startsWith('+10');
const progress=(stage,ids)=>{let have=0,total=0;ids.forEach(id=>{const need=D[id][1],n=state[K(stage,id)]||0;have+=Math.min(n,need);total+=need});return total?Math.round(have/total*100):0};
function progressRow(icon,label,p,kind){return `<div class="progress-row ${kind}"><div class="progress-title"><span class="progress-symbol">${icon}</span><b>${label}</b><strong>${p}%</strong></div><div class="bar"><div class="fill" style="width:${p}%"></div></div></div>`}
function render(){app.innerHTML=stages.map(s=>{const gear=s[3].filter(isGear),resources=s[3].filter(id=>!isGear(id)),allP=progress(s[0],s[3]),gearP=progress(s[0],gear),resP=progress(s[0],resources),done=s[3].filter(id=>(state[K(s[0],id)]||0)>=D[id][1]).length;return `<section class="stage"><div class="head"><div><h2>${s[1]} <span class="badge">${done}/${s[3].length}</span></h2><div class="route">${s[2]}</div></div><div class="need">Общий прогресс ${allP}%</div></div><div class="progress-board">${progressRow('⚓','Общий прогресс',allP,'overall')}${progressRow('🛠️','Обвесы и разрешения',gearP,'gear')}${progressRow('📦','Ресурсы',resP,'resource')}</div><div class="grid">${s[3].map(id=>{let d=D[id],n=state[K(s[0],id)]||0,pct=Math.min(100,Math.round(n/d[1]*100)),complete=pct>=100;return `<article class="item ${complete?'done':''}"><div class="icon ${complete?'full':''}" style="--pct:${pct}%"><img class="icon-base" src="${A+id}.webp" alt="${d[0]}"><img class="icon-progress" src="${A+id}.webp" alt="" aria-hidden="true"><span class="icon-percent">${pct}%</span></div><div><div class="name">${d[0]}</div><div class="need">Нужно: ${d[1]} шт.</div><div class="controls"><button onclick="setN('${s[0]}','${id}',${n}-1)">−</button><input class="count" type="number" min="0" value="${n}" onchange="setN('${s[0]}','${id}',this.value)"><span class="need">/ ${d[1]}</span><button onclick="setN('${s[0]}','${id}',${n}+1)">+</button></div><button class="info" onclick="openInfo('${id}')"><b>i</b> Получение</button></div></article>`}).join('')}</div></section>`}).join('')}
function openInfo(id){let d=D[id];drawerContent.innerHTML=`<div class="dhead"><img src="${A+id}.webp"><div><div class="need">ПОЛУЧЕНИЕ РЕСУРСА</div><h3>${d[0]}</h3></div></div><div class="detail"><h4>Подробная информация</h4><p>${d[2]}</p><a href="${d[3]}" target="_blank">Открыть предмет в BDO Codex ↗</a></div>`;drawer.classList.add('open');shade.classList.add('open');drawer.setAttribute('aria-hidden','false')}function closeInfo(){drawer.classList.remove('open');shade.classList.remove('open');drawer.setAttribute('aria-hidden','true')}document.addEventListener('keydown',e=>{if(e.key==='Escape')closeInfo()});
function resetAll(){if(confirm('Обнулить весь прогресс?')){state={};save()}}function backup(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(state,null,2)],{type:'application/json'}));a.download='bdo_ship_progress.json';a.click()}load.onchange=async e=>{try{state=JSON.parse(await e.target.files[0].text());save()}catch{alert('Не удалось прочитать файл')}};
function paintCards(){document.querySelectorAll('.item').forEach(card=>{const icon=card.querySelector('.icon');card.style.setProperty('--pct',icon?.style.getPropertyValue('--pct')||'0%')})}

)}"><div><div class="stock-name">${d[0]}</div><div class="stock-controls"><button onclick="setStock('${id}',${n}-1)">−</button><input class="count" type="number" min="0" value="${n}" onchange="setStock('${id}',this.value)"><button onclick="setStock('${id}',${n}+1)">+</button></div><div class="stock-stats"><span>Нужно: ${need}</span><span>В крафтах: ${used}</span>${lack?`<span class="lack">Не хватает: ${lack}</span>`:'<span>Хватает ✓</span>'}</div></div></div>`}).join('')}</div></aside>`}

window.autoAllocate=()=>{const selected=order.filter(s=>ui.selected[s]);if(!selected.length){alert('Сначала отметьте галочкой хотя бы один корабль или обвес.');return}if(!confirm('Заменить текущие счетчики ресурсов только в выбранных крафтах данными со склада?'))return;selected.forEach(s=>crafts[s].ids.forEach(id=>state[K(s,id)]=0));const all=[...new Set(selected.flatMap(s=>crafts[s].ids))];all.forEach(id=>{let left=Math.max(0,Math.floor(warehouse[id]||0)),targets=selected.filter(s=>crafts[s].ids.includes(id));if(ui.mode==='sequence'){targets.forEach(s=>{const give=Math.min(left,D[id][1]);state[K(s,id)]=give;left-=give})}else{while(left>0&&targets.some(s=>state[K(s,id)]<D[id][1]))for(const s of targets){if(!left)break;if(state[K(s,id)]<D[id][1]){state[K(s,id)]++;left--}}}});persist()};
window.openPlannerInfo=id=>{const d=D[id];drawerContent.innerHTML=`<div class="dhead"><img src="${icon(id)}"><div><div class="need">ПОЛУЧЕНИЕ РЕСУРСА</div><h3>${d[0]}</h3></div></div><div class="detail"><h4>Подробная информация</h4><p>${d[2]}</p><a href="${d[3]}" target="_blank">Открыть источник ↗</a></div>`;drawer.classList.add('open');shade.classList.add('open');drawer.setAttribute('aria-hidden','false')};
function draw(){let planner=document.querySelector('.planner');if(!planner){planner=document.createElement('div');planner.className='planner';const column=document.createElement('div');column.className='craft-column';app.parentNode.insertBefore(planner,app);planner.appendChild(document.createElement('aside'));planner.appendChild(column);column.appendChild(app)}planner.firstElementChild.outerHTML=warehouseHTML();app.innerHTML=root('caravel')+root('advance',['gear_dragon','gear_armor','gear_meyna','gear_storm','chiro_figure_stage','chiro_sail_stage','chiro_cannon_stage','chiro_hull_stage'])}
window.backup=()=>{const data={version:3,progress:state,warehouse,ui};const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));a.download='bdo_ship_tracker_backup.json';a.click()};
window.resetAll=()=>{if(confirm('Обнулить весь прогресс, склад и выбор крафтов?')){state={};warehouse={};ui={open:{},selected:{},mode:'sequence'};persist()}};
load.onchange=async e=>{try{const x=JSON.parse(await e.target.files[0].text());if(x.version>=3){state=x.progress||{};warehouse=x.warehouse||{};ui=x.ui||{open:{},selected:{},mode:'sequence'}}else state=x;persist()}catch{alert('Не удалось прочитать файл')}};
draw();
})();
</script></body></html>
